[package]
name = "krishiv-plan"
description = "Logical and physical plans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# One-row arrays: constant arguments fold through the cast kernels.
arrow-array.workspace = true
arrow-schema.workspace = true
krishiv-common = { path = "../krishiv-common" }
# The built-in function registry and the signature types it shares.
krishiv-functions = { path = "../krishiv-functions" }
# Spark's decimal result types, shared with the kernels that compute them.
krishiv-kernels = { path = "../krishiv-kernels" }
# Session UDFs, for constant folding through the registry.
krishiv-udf-sdk = { path = "../krishiv-udf-sdk" }
krishiv-types = { path = "../krishiv-types" }
thiserror.workspace = true
twox-hash = { workspace = true, features = ["xxhash3_128"] }

[features]
# Test doubles (a function registry) for other crates' tests and benchmarks.
testing = []

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
proptest = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[[bench]]
name = "plan_key"
harness = false

[lints]
workspace = true
