[package]
name = "krishiv-plan"
description = "Logical and physical plans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[dependencies]
# One-row arrays: constant arguments fold through the cast kernels.
arrow-array.workspace = true
arrow-schema.workspace = true
krishiv-common = { path = "../krishiv-common", version = "=0.2.0" }
# The built-in function registry and the signature types it shares.
krishiv-functions = { path = "../krishiv-functions", version = "=0.2.0" }
# The CSV literal inference `schema_of_csv` resolves with (layer L2).
krishiv-io = { path = "../krishiv-io", version = "=0.2.0" }
# Spark's decimal result types, shared with the kernels that compute them.
krishiv-kernels = { path = "../krishiv-kernels", version = "=0.2.0" }
# Session UDFs, for constant folding through the registry.
krishiv-udf-sdk = { path = "../krishiv-udf-sdk", version = "=0.2.0" }
krishiv-types = { path = "../krishiv-types", version = "=0.2.0" }
thiserror.workspace = true
# One trace event per privilege check (`analyzer/access.rs`, target `krishiv::authorize`).
tracing.workspace = true
twox-hash = { workspace = true, features = ["xxhash3_128"] }

[features]
# Test doubles (a function registry) for other crates' tests and benchmarks.
testing = []

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
proptest = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[[bench]]
name = "plan_key"
harness = false

[lints]
workspace = true
