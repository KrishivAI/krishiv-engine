[package]
name = "krishiv-scheduler"
description = "Distributed scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arrow-schema.workspace = true
futures = { workspace = true, features = ["alloc"] }
krishiv-common = { path = "../krishiv-common" }
krishiv-exec = { path = "../krishiv-exec" }
krishiv-io = { path = "../krishiv-io" }
krishiv-plan = { path = "../krishiv-plan" }
krishiv-shuffle = { path = "../krishiv-shuffle" }
krishiv-types = { path = "../krishiv-types" }

[dev-dependencies]
arrow-array.workspace = true
krishiv-memory = { path = "../krishiv-memory" }
krishiv-optimizer = { path = "../krishiv-optimizer" }
krishiv-plan = { path = "../krishiv-plan", features = ["testing"] }
krishiv-plan-codec = { path = "../krishiv-plan-codec" }
krishiv-sql = { path = "../krishiv-sql" }
object_store = { workspace = true, features = ["fs"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
