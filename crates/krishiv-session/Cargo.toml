[package]
name = "krishiv-session"
description = "Krishiv sessions: SQL and DataFrames over the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
# `executor`: file footers are read on a thread of their own (catalog.rs).
futures = { workspace = true, features = ["alloc", "executor"] }
krishiv-common = { path = "../krishiv-common" }
krishiv-exec = { path = "../krishiv-exec" }
krishiv-functions = { path = "../krishiv-functions" }
krishiv-io = { path = "../krishiv-io" }
krishiv-kernels = { path = "../krishiv-kernels" }
krishiv-memory = { path = "../krishiv-memory" }
krishiv-optimizer = { path = "../krishiv-optimizer" }
krishiv-plan = { path = "../krishiv-plan" }
krishiv-plan-codec = { path = "../krishiv-plan-codec" }
krishiv-sql = { path = "../krishiv-sql" }
krishiv-types = { path = "../krishiv-types" }
krishiv-udf-sdk = { path = "../krishiv-udf-sdk" }
# The `EXPLAIN VERBOSE` JSON document.
serde_json = { workspace = true, features = ["std"] }
# Row hashes for the agent table (`xxhash3_128`, v1 frozen in `agent.rs`).
twox-hash = { workspace = true, features = ["xxhash3_128"] }
# Warnings from analysis and planning are logged, as Spark logs them.
tracing.workspace = true
# A oneshot channel back from tasks on the session's executor; `rt` to
# enter the I/O runtime from the thread that reads file footers.
tokio = { workspace = true, features = ["rt", "sync"] }
# OTLP export (`otlp.rs`, feature `telemetry-otlp`).
http = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true, features = ["trace"] }
opentelemetry-http = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true, features = ["http-proto", "trace", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-proto = { workspace = true, optional = true, features = ["gen-tonic-messages", "metrics", "trace"] }
opentelemetry_sdk = { workspace = true, optional = true, features = ["trace"] }
tracing-opentelemetry = { workspace = true, optional = true }
prost = { workspace = true, optional = true, features = ["std"] }
reqwest = { workspace = true, optional = true, features = ["blocking", "rustls"] }
tracing-subscriber = { workspace = true, optional = true, features = ["registry", "std"] }
# The local file system as a store (`fs`); no other store features.
object_store = { workspace = true, features = ["fs"] }

[dev-dependencies]
bytes.workspace = true
arrow-select.workspace = true
futures = { workspace = true, features = ["alloc", "executor"] }
insta.workspace = true
parquet = { workspace = true, features = ["arrow"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing-subscriber = { workspace = true, features = ["registry", "std"] }

[features]
# Cloud object stores (S3, GCS, Azure) via `krishiv-io/cloud`. Opt-in so the
# default build stays inside the dependency and binary-size budgets.
cloud = ["krishiv-exec/cloud", "krishiv-io/cloud"]
# Access to the logical-plan IR (`Session::from_plan`, `DataFrame::plan`):
# for the Python facade and tests; not covered by semver.
unstable-ir = []
# OTLP export of the `krishiv.query` spans and the engine metrics over http-proto (rustls, no
# OpenSSL, no gRPC stack). Off in the default embedded build.
telemetry-otlp = [
  "dep:http", "dep:opentelemetry", "dep:opentelemetry-http", "dep:opentelemetry-otlp",
  "dep:opentelemetry-proto", "dep:prost", "dep:reqwest", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "dep:tracing-subscriber",
]

[[test]]
name = "otlp_collector"
required-features = ["telemetry-otlp"]

[lints]
workspace = true

# The S3 round trip needs the S3 builder and an emulator (`KRISHIV_TEST_S3_ENDPOINT`).
[[test]]
name = "s3_tpch"
required-features = ["cloud"]
