[package]
name = "krishiv-session"
description = "Krishiv sessions: SQL and DataFrames over the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
thiserror = { workspace = true, optional = true }
# `executor`: file footers are read on a thread of their own (catalog.rs).
futures = { workspace = true, features = ["alloc", "executor"] }
krishiv-common = { path = "../krishiv-common", version = "=0.2.1" }
krishiv-exec = { path = "../krishiv-exec", version = "=0.2.1" }
krishiv-functions = { path = "../krishiv-functions", version = "=0.2.1" }
krishiv-io = { path = "../krishiv-io", version = "=0.2.1" }
krishiv-kernels = { path = "../krishiv-kernels", version = "=0.2.1" }
krishiv-memory = { path = "../krishiv-memory", version = "=0.2.1" }
krishiv-optimizer = { path = "../krishiv-optimizer", version = "=0.2.1" }
krishiv-plan = { path = "../krishiv-plan", version = "=0.2.1" }
krishiv-plan-codec = { path = "../krishiv-plan-codec", version = "=0.2.1" }
krishiv-sql = { path = "../krishiv-sql", version = "=0.2.1" }
krishiv-types = { path = "../krishiv-types", version = "=0.2.1" }
krishiv-udf-sdk = { path = "../krishiv-udf-sdk", version = "=0.2.1" }
# The `EXPLAIN VERBOSE` JSON document; OIDC token and JWK set parsing (`auth/jose.rs`).
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
# OIDC signature checks (P3-T002 PR-14d; design §3.3): RSA PKCS#1 v1.5 and ECDSA, feature `oidc`.
aws-lc-rs = { workspace = true, optional = true }
# Static token digests (`auth/tokens.rs`, P3-T002).
sha2.workspace = true
# Row hashes for the agent table (`xxhash3_128`, v1 frozen in `agent.rs`).
twox-hash = { workspace = true, features = ["xxhash3_128"] }
# Selector patterns of the resource group file (`resource_groups/config.rs`).
regex-lite.workspace = true
# Warnings from analysis and planning are logged, as Spark logs them.
tracing.workspace = true
# A oneshot channel back from tasks on the session's executor; `rt` to
# enter the I/O runtime from the thread that reads file footers.
tokio = { workspace = true, features = ["rt", "sync"] }
# OTLP export (`otlp.rs`, feature `telemetry-otlp`).
http = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true, features = ["trace"] }
opentelemetry-http = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true, features = ["http-proto", "trace", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-proto = { workspace = true, optional = true, features = ["gen-tonic-messages", "metrics", "trace"] }
opentelemetry_sdk = { workspace = true, optional = true, features = ["trace"] }
tracing-opentelemetry = { workspace = true, optional = true }
prost = { workspace = true, optional = true, features = ["std"] }
reqwest = { workspace = true, optional = true, features = ["blocking", "rustls"] }
# Server TLS (P3-T002 PR-14c; design §3.5): rustls on the aws-lc-rs provider, never OpenSSL.
rustls = { workspace = true, optional = true, features = ["aws_lc_rs", "std", "tls12"] }
tracing-subscriber = { workspace = true, optional = true, features = ["registry", "std"] }
# The local file system as a store (`fs`); no other store features.
object_store = { workspace = true, features = ["fs"] }

[dev-dependencies]
bytes.workspace = true
arrow-select.workspace = true
futures = { workspace = true, features = ["alloc", "executor"] }
insta.workspace = true
parquet = { workspace = true, features = ["arrow"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing-subscriber = { workspace = true, features = ["registry", "std", "fmt", "json"] }

[features]
# Cloud object stores (S3, GCS, Azure) via `krishiv-io/cloud`. Opt-in so the
# default build stays inside the dependency and binary-size budgets.
cloud = ["krishiv-exec/cloud", "krishiv-io/cloud"]
# ICU collations (ADR 0043): UNICODE, en, sv, ... with _CI/_AI.
collations-icu = ["krishiv-exec/collations-icu", "krishiv-plan/collations-icu", "krishiv-kernels/collations-icu"]
# Server TLS for the listeners (`auth::ServerTls`: rustls on aws-lc-rs, reloadable certificate,
# client-certificate verification). `krishiv-server`'s `server` feature turns it on.
tls = ["dep:rustls"]
# OIDC access tokens (`auth::OidcConfig`): JWT signatures on aws-lc-rs, the JWK set fetched over
# HTTPS (reqwest, rustls). Off by default; a server build turns it on.
oidc = ["dep:aws-lc-rs", "dep:reqwest"]
# Access to the logical-plan IR (`Session::from_plan`, `DataFrame::plan`):
# for the Python facade and tests; not covered by semver.
unstable-ir = []
# OTLP export of the `krishiv.query` spans and the engine metrics over http-proto (rustls, no
# OpenSSL, no gRPC stack). Off in the default embedded build.
telemetry-otlp = [
    "dep:http",
    "dep:opentelemetry",
    "dep:opentelemetry-http",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-proto",
    "dep:prost",
    "dep:reqwest",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

# Structured JSON logs with the query's ids and a per-callsite rate limit (`logging.rs`).
telemetry-logs = [
    "dep:thiserror",
    "dep:tracing-subscriber",
    "tracing-subscriber/fmt",
    "tracing-subscriber/json",
]

[[test]]
name = "otlp_collector"
required-features = ["telemetry-otlp"]

[[test]]
name = "log_records"
required-features = ["telemetry-logs"]

[lints]
workspace = true

# The S3 round trip needs the S3 builder and an emulator (`KRISHIV_TEST_S3_ENDPOINT`).
[[test]]
name = "s3_tpch"
required-features = ["cloud"]
