[package]
name = "krishiv-sql"
description = "SQL parsing and analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
krishiv-common = { path = "../krishiv-common", version = "=0.2.0" }
krishiv-kernels = { path = "../krishiv-kernels", version = "=0.2.0" }
krishiv-plan = { path = "../krishiv-plan", version = "=0.2.0" }
krishiv-types = { path = "../krishiv-types", version = "=0.2.0" }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
insta = { workspace = true }
krishiv-plan = { path = "../krishiv-plan", features = ["testing"] }
proptest = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "lower"
harness = false

[[bench]]
name = "plan"
harness = false
