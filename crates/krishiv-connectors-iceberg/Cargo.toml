[package]
name = "krishiv-connectors-iceberg"
description = "Iceberg connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arrow-array = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
iceberg = { workspace = true }
krishiv-arrow-bridge = { path = "../krishiv-arrow-bridge" }
krishiv-common = { path = "../krishiv-common" }
krishiv-exec = { path = "../krishiv-exec" }
krishiv-io = { path = "../krishiv-io" }
krishiv-types = { path = "../krishiv-types" }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt"] }
typetag = { workspace = true }

[dev-dependencies]
object_store = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
