[package]
name = "krishiv-connectors-iceberg"
description = "Iceberg connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arrow-array = { workspace = true }
# Equality delete keys (row format) and dropping deleted rows.
arrow-row = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
iceberg = { workspace = true }
krishiv-arrow-bridge = { path = "../krishiv-arrow-bridge" }
krishiv-common = { path = "../krishiv-common" }
krishiv-exec = { path = "../krishiv-exec" }
krishiv-io = { path = "../krishiv-io" }
krishiv-memory = { path = "../krishiv-memory" }
krishiv-types = { path = "../krishiv-types" }
# Deletion vectors (the portable roaring64 layout); already built for iceberg.
roaring = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync"] }
typetag = { workspace = true }

[dev-dependencies]
arrow-buffer = { workspace = true }
krishiv-optimizer = { path = "../krishiv-optimizer" }
krishiv-plan = { path = "../krishiv-plan", features = ["testing"] }
krishiv-sql = { path = "../krishiv-sql" }
object_store = { workspace = true }
# Writes the Parquet files of the provider tests (with and without field ids).
parquet = { workspace = true, features = ["arrow"] }
proptest = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
