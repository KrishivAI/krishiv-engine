[package]
name = "krishiv-connectors-iceberg"
description = "Iceberg connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
arrow-array = { workspace = true }
# Equality delete keys (row format) and dropping deleted rows.
arrow-row = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
# Theta sketches of the Puffin NDV statistics (single user of the crate).
datasketches = { workspace = true }
# Equality delete key sets (hash table of row indices, fast hasher).
foldhash = { workspace = true }
futures = { workspace = true }
hashbrown = { workspace = true }
iceberg = { workspace = true }
krishiv-arrow-bridge = { path = "../krishiv-arrow-bridge", version = "=0.2.1" }
krishiv-common = { path = "../krishiv-common", version = "=0.2.1" }
krishiv-exec = { path = "../krishiv-exec", version = "=0.2.1" }
krishiv-io = { path = "../krishiv-io", version = "=0.2.1" }
krishiv-memory = { path = "../krishiv-memory", version = "=0.2.1" }
# The optimizer's statistics (`TableStats`, `Literal` bounds) from manifests.
krishiv-optimizer = { path = "../krishiv-optimizer", version = "=0.2.1" }
krishiv-plan = { path = "../krishiv-plan", version = "=0.2.1" }
krishiv-types = { path = "../krishiv-types", version = "=0.2.1" }
# Deletion vectors (the portable roaring64 layout); already built for iceberg.
roaring = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# Warnings of statistics dropped on write (PR-54b).
tracing = { workspace = true }
typetag = { workspace = true }
# Feature `testing` only: the Parquet files and the local store of `testing::write_table`.
parquet = { workspace = true, features = ["arrow"], optional = true }
object_store = { workspace = true, optional = true }

[dev-dependencies]
arrow-buffer = { workspace = true }
criterion.workspace = true
krishiv-plan = { path = "../krishiv-plan", features = ["testing"] }
krishiv-sql = { path = "../krishiv-sql" }
object_store = { workspace = true }
# Writes the Parquet files of the provider tests (with and without field ids).
parquet = { workspace = true, features = ["arrow"] }
proptest = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[[bench]]
name = "theta_update"
harness = false

[features]
# Cloud object stores through `krishiv-exec/cloud` (S3, GCS, Azure); the Azurite Iceberg scan test needs it.
cloud = ["krishiv-exec/cloud"]
# Test tables for other crates' tests (`testing::write_table`: Parquet files and iceberg-rust's in-memory catalog
# over the local file system). Never enabled by a product build.
testing = ["dep:parquet", "dep:object_store"]
