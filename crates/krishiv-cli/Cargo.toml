[package]
name = "krishiv-cli"
description = "Krishiv command line binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[[bin]]
name = "krishiv"
path = "src/main.rs"
# The bin and the `krishiv` library would write the same rustdoc output
# directory (cargo#6313), racing under `cargo doc --workspace`.
doc = false

[dependencies]
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context"] }
futures = { workspace = true, features = ["alloc", "executor"] }
krishiv = { path = "../krishiv", version = "=0.2.0", default-features = false }
krishiv-alloc = { path = "../krishiv-alloc", version = "=0.2.0", optional = true }
krishiv-memory = { path = "../krishiv-memory", version = "=0.2.0", optional = true }
krishiv-common = { path = "../krishiv-common", version = "=0.2.0" }
krishiv-functions = { path = "../krishiv-functions", version = "=0.2.0" }
krishiv-sql = { path = "../krishiv-sql", version = "=0.2.0" }
reedline = { workspace = true }
krishiv-server = { path = "../krishiv-server", version = "=0.2.0", optional = true }
krishiv-session = { path = "../krishiv-session", version = "=0.2.0", optional = true }
krishiv-mcp = { path = "../krishiv-mcp", version = "=0.2.0", optional = true }
krishiv-connect-server = { path = "../krishiv-connect-server", version = "=0.2.0", optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"], optional = true }
serde_json = { workspace = true }
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
libmimalloc-sys = { workspace = true, features = ["extended"] }

[lints]
workspace = true

[features]
# The binary links mimalloc by default (P2-T012); libraries never do.
default = ["mimalloc", "collations-icu"]
# Strictly additive (ADR 0027); each forwards to the facade crate.
kafka = ["krishiv/kafka"]
iceberg = ["krishiv/iceberg"]
delta = ["krishiv/delta"]
cdc = ["krishiv/cdc"]
connect = ["krishiv/connect"]
flight-sql = ["krishiv/flight-sql"]
mcp = ["krishiv/mcp", "dep:krishiv-mcp", "dep:tokio"]
python = ["krishiv/python"]
collations-icu = ["krishiv/collations-icu"]
wasm-udf = ["krishiv/wasm-udf"]
# `krishiv server`: Spark Connect (gRPC) and the admin server (healthz, readyz, metrics).
server = [
    "dep:krishiv-server",
    "krishiv-server/session",
    "krishiv-server/metrics-prometheus",
    "dep:krishiv-session",
    "dep:krishiv-connect-server",
    "dep:axum",
    "dep:tokio",
    "tokio/net",
    "tokio/signal",
    "tokio/sync",
    "tokio/macros",
    "tokio/time",
]
# The web UI on the admin server.
ui = ["krishiv/ui", "server"]
celeborn = ["krishiv/celeborn"]
mimalloc = ["krishiv/mimalloc", "dep:mimalloc", "dep:krishiv-alloc", "dep:krishiv-memory"]
# Live async-task diagnostics over `tokio-console` (P2-T129): off by default;
# needs `RUSTFLAGS="--cfg tokio_unstable"` for the task names.
tokio-console = ["krishiv/tokio-console"]
# JSON logs on stderr with `KRISHIV_LOG=json` (T116).
telemetry-logs = ["krishiv/telemetry-logs", "dep:krishiv-session"]
# Cloud object stores (S3, GCS, Azure). Opt-in so the default build stays
# inside the dependency and binary-size budgets.
cloud = ["krishiv/cloud"]
full = ["krishiv/full"]
