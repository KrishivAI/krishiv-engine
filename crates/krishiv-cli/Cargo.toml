[package]
name = "krishiv-cli"
description = "Krishiv command line binary"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[[bin]]
name = "krishiv"
path = "src/main.rs"
# The bin and the `krishiv` library would write the same rustdoc output
# directory (cargo#6313), racing under `cargo doc --workspace`.
doc = false

[dependencies]
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context"] }
futures = { workspace = true, features = ["alloc", "executor"] }
krishiv = { path = "../krishiv", version = "=0.3.0", default-features = false }
krishiv-alloc = { path = "../krishiv-alloc", version = "=0.3.0", optional = true }
krishiv-memory = { path = "../krishiv-memory", version = "=0.3.0" }
krishiv-common = { path = "../krishiv-common", version = "=0.3.0" }
krishiv-functions = { path = "../krishiv-functions", version = "=0.3.0" }
krishiv-sql = { path = "../krishiv-sql", version = "=0.3.0" }
reedline = { workspace = true }
krishiv-server = { path = "../krishiv-server", version = "=0.3.0", optional = true }
krishiv-session = { path = "../krishiv-session", version = "=0.3.0", optional = true }
krishiv-mcp = { path = "../krishiv-mcp", version = "=0.3.0", optional = true }
krishiv-connect-server = { path = "../krishiv-connect-server", version = "=0.3.0", optional = true }
krishiv-flight-sql = { path = "../krishiv-flight-sql", version = "=0.3.0", optional = true }
krishiv-udf-pool = { path = "../krishiv-udf-pool", version = "=0.3.0", optional = true }
# Declared `iceberg-rest` catalogs in `krishiv server` (feature `catalog-iceberg-rest`, design P3-T067 §2.3).
krishiv-catalogs = { path = "../krishiv-catalogs", version = "=0.3.0", optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"], optional = true }
serde_json = { workspace = true }
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
arrow-array.workspace = true
arrow-flight = { workspace = true, features = ["flight-sql"] }
arrow-schema.workspace = true
futures = { workspace = true, features = ["std"] }
tonic = { workspace = true, features = ["channel"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
tempfile.workspace = true
libmimalloc-sys = { workspace = true, features = ["extended"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[features]
# The binary links mimalloc by default (P2-T012); libraries never do.
default = ["mimalloc", "collations-icu"]
# Strictly additive (ADR 0027); each forwards to the facade crate.
kafka = ["krishiv/kafka"]
iceberg = ["krishiv/iceberg"]
delta = ["krishiv/delta"]
cdc = ["krishiv/cdc"]
# The Connect server hosts the Python UDF worker pool; the binary runs its sandbox trampoline (P3-T014).
connect = ["krishiv/connect", "dep:krishiv-udf-pool"]
# Arrow Flight SQL on the Spark Connect port of `krishiv server` (P3-T101); implies `server`.
flight-sql = ["krishiv/flight-sql", "server", "dep:krishiv-flight-sql"]
mcp = ["krishiv/mcp", "dep:krishiv-mcp", "dep:tokio"]
python = ["krishiv/python"]
collations-icu = ["krishiv/collations-icu"]
wasm-udf = ["krishiv/wasm-udf"]
# `krishiv server`: Spark Connect (gRPC) and the admin server (healthz, readyz, metrics).
server = [
    "dep:krishiv-server",
    "krishiv-server/session",
    "krishiv-server/metrics-prometheus",
    "krishiv-server/admin-api",
    "krishiv-server/tls",
    "krishiv-server/access-external",
    "dep:krishiv-session",
    "krishiv-session/tls",
    "dep:krishiv-connect-server",
    # The Connect server hosts the Python UDF worker pool; the binary runs its sandbox trampoline.
    "dep:krishiv-udf-pool",
    "dep:axum",
    "dep:tokio",
    "tokio/net",
    "tokio/signal",
    "tokio/sync",
    "tokio/macros",
    "tokio/time",
]
# The web UI on the admin server.
ui = ["krishiv/ui", "server"]
# `krishiv server` builds declared `iceberg-rest` catalogs (krishiv.catalog.<name>.type = iceberg-rest);
# without it such a declaration fails startup naming the type.
catalog-iceberg-rest = ["server", "dep:krishiv-catalogs", "krishiv-catalogs/session"]
# `krishiv server` keeps persisted Python UDFs in a SQLite catalog file (`krishiv.connect.pythonFunctions.catalog`, P3-T072c);
# a C build (bundled SQLite). Without it the setting fails startup naming the feature.
python-function-catalog = ["server", "dep:krishiv-catalogs", "krishiv-catalogs/sqlite", "krishiv-connect-server/function-catalog"]
celeborn = ["krishiv/celeborn"]
mimalloc = ["krishiv/mimalloc", "dep:mimalloc", "dep:krishiv-alloc"]
# Live async-task diagnostics over `tokio-console` (P2-T129): off by default;
# needs `RUSTFLAGS="--cfg tokio_unstable"` for the task names.
tokio-console = ["krishiv/tokio-console"]
# JSON logs on stderr with `KRISHIV_LOG=json` (T116).
telemetry-logs = ["krishiv/telemetry-logs", "dep:krishiv-session"]
# OTLP export of the query spans and engine metrics.
telemetry-otlp = ["krishiv/telemetry-otlp", "dep:krishiv-session"]
# Cloud object stores (S3, GCS, Azure). Opt-in so the default build stays
# inside the dependency and binary-size budgets.
cloud = ["krishiv/cloud"]
full = ["krishiv/full", "catalog-iceberg-rest"]
