[package]
name = "krishiv-kernels"
description = "Compute kernels (SIMD)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
arrow-string.workspace = true
arrow-ord.workspace = true
krishiv-common = { path = "../krishiv-common", version = "=0.2.1" }
krishiv-types = { path = "../krishiv-types", version = "=0.2.1" }
jiff = { workspace = true, features = ["std", "tzdb-bundle-always"] }
libm.workspace = true
memchr = { workspace = true, features = ["std"] }
md5.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
icu_collator = { workspace = true, optional = true }
icu_locale_core = { workspace = true, optional = true }
icu_casemap = { workspace = true, optional = true }

[features]
# ICU collations (UNICODE, en, sv, ..., with _CI/_AI): ICU4X data compiled in (ADR 0043). Additive; without it ICU names are unsupported.
collations-icu = ["dep:icu_collator", "dep:icu_locale_core", "dep:icu_casemap", "icu_collator/compiled_data", "icu_casemap/compiled_data"]

[dev-dependencies]
criterion.workspace = true
# Benchmarks run under the shipped allocator (design note: relative, mimalloc).
mimalloc.workspace = true
proptest = { workspace = true, features = ["std"] }

[[bench]]
name = "binary_add"
harness = false

[[bench]]
name = "arith"
harness = false

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "cast"
harness = false

[[bench]]
name = "list"
harness = false

[[bench]]
name = "collation_key"
harness = false
