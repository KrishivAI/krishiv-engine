[package]
name = "krishiv-kernels"
description = "Compute kernels (SIMD)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
arrow-string.workspace = true
arrow-ord.workspace = true
krishiv-common = { path = "../krishiv-common" }
jiff = { workspace = true, features = ["std", "tzdb-bundle-always"] }
libm.workspace = true
md5.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
# Benchmarks run under the shipped allocator (design note: relative, mimalloc).
mimalloc.workspace = true
proptest = { workspace = true, features = ["std"] }

[[bench]]
name = "binary_add"
harness = false

[[bench]]
name = "arith"
harness = false

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "cast"
harness = false

[[bench]]
name = "list"
harness = false
