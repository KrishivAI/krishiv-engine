[package]
name = "krishiv"
description = "Spark-compatible SQL and DataFrame engine in Rust: embedded, vectorized on Arrow, no JVM"
keywords = ["spark", "sql", "dataframe", "arrow", "query-engine"]
categories = ["database-implementations", "data-structures"]
homepage = "https://krishiv.ai"
documentation = "https://docs.rs/krishiv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
krishiv-common = { path = "../krishiv-common", version = "=0.2.0" }
krishiv-exec = { path = "../krishiv-exec", version = "=0.2.0", optional = true }
krishiv-server = { path = "../krishiv-server", version = "=0.2.0", optional = true }
krishiv-session = { path = "../krishiv-session", version = "=0.2.0" }
krishiv-types = { path = "../krishiv-types", version = "=0.2.0" }

[dev-dependencies]
futures = { workspace = true, features = ["alloc", "executor"] }

[features]
# ICU collations are on by default (ADR 0043 decision 5; +1.7% binary size); turn off with default-features = false.
default = ["collations-icu"]
# Strictly additive (ADR 0027). Forwarded to crates as they gain code.
kafka = []
iceberg = []
delta = []
cdc = []
connect = []
flight-sql = []
mcp = []
python = []
wasm-udf = []
ui = ["dep:krishiv-server"]
celeborn = []
collations-icu = ["krishiv-session/collations-icu"]
mimalloc = []
# Cloud object stores (S3, GCS, Azure) via `krishiv-session/cloud`. Opt-in so
# the default build stays inside the dependency and binary-size budgets.
cloud = ["krishiv-session/cloud"]
# The logical-plan IR (`Session::from_plan`, `DataFrame::plan`): for embedders
# that build plans themselves; not covered by semver.
unstable-ir = ["krishiv-session/unstable-ir"]
# Live async-task diagnostics over `tokio-console` (P2-T129): off by default;
# needs `RUSTFLAGS="--cfg tokio_unstable"` for the task names.
tokio-console = ["dep:krishiv-exec", "krishiv-exec/tokio-console"]
# JSON log records with query, session and trace ids (T116), installed by the CLI
# when `KRISHIV_LOG=json`; embedders call `krishiv_session::logging` themselves.
telemetry-logs = ["krishiv-session/telemetry-logs"]
full = ["kafka", "iceberg", "delta", "cdc", "connect", "flight-sql", "mcp", "python", "wasm-udf", "ui", "celeborn", "mimalloc", "cloud"]
