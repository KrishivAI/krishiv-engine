[package]
name = "krishiv-io"
description = "Object store and file format I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures = { workspace = true, features = ["alloc", "std"] }
krishiv-common = { path = "../krishiv-common" }
# Spark value text conversions and datetime patterns (CSV, JSON, text).
krishiv-kernels = { path = "../krishiv-kernels" }
krishiv-memory = { path = "../krishiv-memory" }
krishiv-types = { path = "../krishiv-types" }
memchr.workspace = true
object_store.workspace = true
# The Parquet reader (P2-T080a): arrow-rs's push decoder and the codecs files
# are written with. Never the `object_store` feature (ADR 0014, deny.toml).
parquet = { workspace = true, features = [
    "arrow",
    "brotli",
    "flate2-zlib-rs",
    "lz4",
    "simdutf8",
    "snap",
    "zstd",
] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
arrow-buffer.workspace = true
arrow-select.workspace = true
# The local file system (directories, files in the way) in commit tests.
object_store = { workspace = true, features = ["fs"] }
criterion.workspace = true
proptest = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[[bench]]
name = "io"
harness = false
