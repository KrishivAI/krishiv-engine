[package]
name = "krishiv-io"
description = "Object store and file format I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
apache-avro.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
# Avro field defaults (`RecordField::default`) are JSON values.
serde_json = { workspace = true, features = ["std"] }
# Exact runtime-filter sets, placed by the row hash (P2-T163).
hashbrown.workspace = true
futures = { workspace = true, features = ["alloc", "std"] }
krishiv-common = { path = "../krishiv-common" }
# Spark value text conversions and datetime patterns (CSV, JSON, text).
krishiv-kernels = { path = "../krishiv-kernels" }
krishiv-memory = { path = "../krishiv-memory" }
krishiv-types = { path = "../krishiv-types" }
memchr.workspace = true
object_store.workspace = true
# The Parquet reader (P2-T080a): arrow-rs's push decoder and the codecs files
# are written with. Never the `object_store` feature (ADR 0014, deny.toml).
parquet = { workspace = true, features = [
    "arrow",
    "brotli",
    "flate2-zlib-rs",
    "lz4",
    "simdutf8",
    "snap",
    "zstd",
] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# Runtime-filter Bloom filters hash as Parquet's (XXH64, P2-T163).
twox-hash = { workspace = true, features = ["xxhash64"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
arrow-buffer.workspace = true
arrow-select.workspace = true
# The local file system (directories, files in the way) in commit tests.
object_store = { workspace = true, features = ["fs"] }
criterion.workspace = true
proptest = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[target.'cfg(loom)'.dev-dependencies]
loom.workspace = true

[features]
# Cloud object stores (S3, GCS, Azure): the `aws`/`azure`/`gcp` features of
# `object_store` (reqwest over rustls). Opt-in so the default build stays
# inside the dependency and binary-size budgets. Without it, cloud URLs fail
# with `KRISHIV_UNSUPPORTED_FEATURE`.
cloud = ["object_store/aws", "object_store/azure", "object_store/gcp"]

# The emulator round-trips need the cloud builders.
[[test]]
name = "object_stores"
required-features = ["cloud"]

[[bench]]
name = "coalesce"
harness = false

[[bench]]
name = "io"
harness = false

[[bench]]
name = "runtime_filter"
harness = false
