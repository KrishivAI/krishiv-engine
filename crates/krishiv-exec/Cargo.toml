[package]
name = "krishiv-exec"
description = "Batch execution engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-row.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
foldhash.workspace = true
hashbrown.workspace = true
futures = { workspace = true, features = ["alloc"] }
krishiv-common = { path = "../krishiv-common" }
krishiv-functions = { path = "../krishiv-functions" }
krishiv-io = { path = "../krishiv-io" }
krishiv-kernels = { path = "../krishiv-kernels" }
krishiv-memory = { path = "../krishiv-memory" }
krishiv-optimizer = { path = "../krishiv-optimizer" }
krishiv-plan = { path = "../krishiv-plan" }
krishiv-types = { path = "../krishiv-types" }
# Store paths of reads by path (`files`).
object_store.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
insta.workspace = true
krishiv-plan = { path = "../krishiv-plan", features = ["testing"] }
krishiv-sql = { path = "../krishiv-sql" }
arrow-ipc = { workspace = true, features = ["zstd"] }
criterion.workspace = true
object_store = { workspace = true, features = ["fs"] }
proptest = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true, features = ["futures"] }

[features]
# Row-layout key-page prototype (P2-T157); not part of the default build.
row-table-prototype = []

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "operators"
harness = false

[[bench]]
name = "aggregate"
harness = false

[[bench]]
name = "sort"
harness = false

[[bench]]
name = "hash_join"
harness = false

[[bench]]
name = "row_table"
harness = false
required-features = ["row-table-prototype"]

[[example]]
name = "row_table_matrix"
required-features = ["row-table-prototype"]
