[package]
name = "krishiv-exec"
description = "Batch execution engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-row.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
foldhash.workspace = true
hashbrown.workspace = true
futures = { workspace = true, features = ["alloc"] }
krishiv-common = { path = "../krishiv-common" }
krishiv-io = { path = "../krishiv-io" }
krishiv-memory = { path = "../krishiv-memory" }
krishiv-types = { path = "../krishiv-types" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
arrow-ipc = { workspace = true, features = ["zstd"] }
criterion.workspace = true
object_store.workspace = true
proptest = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true, features = ["futures"] }

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "operators"
harness = false

[[bench]]
name = "aggregate"
harness = false
