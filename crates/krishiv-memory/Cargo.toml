[package]
name = "krishiv-memory"
description = "Memory management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-ipc = { workspace = true, features = ["lz4", "zstd"] }
arrow-schema.workspace = true
krishiv-common = { path = "../krishiv-common" }
krishiv-types = { path = "../krishiv-types" }
thiserror.workspace = true
# The mimalloc settings of `mimalloc` (feature): FFI only, no global allocator.
libmimalloc-sys = { workspace = true, features = ["extended"], optional = true }

[features]
# For binaries whose global allocator is mimalloc (`krishiv_memory::mimalloc`).
mimalloc = ["dep:libmimalloc-sys"]

[dev-dependencies]
criterion.workspace = true
proptest = { workspace = true, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true, features = ["futures"] }

[[bench]]
name = "spill_file"
harness = false
