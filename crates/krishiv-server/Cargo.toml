[package]
name = "krishiv-server"
description = "Admin and UI API server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
krishiv-common = { path = "../krishiv-common", version = "=0.2.0", optional = true }
krishiv-exec = { path = "../krishiv-exec", version = "=0.2.0", optional = true }
krishiv-session = { path = "../krishiv-session", version = "=0.2.0", optional = true }
krishiv-ui-assets = { path = "../krishiv-ui-assets", version = "=0.2.0" }
futures = { workspace = true, features = ["alloc"] }
getrandom.workspace = true
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-rustls = { workspace = true, optional = true }
tracing.workspace = true

[features]
# Prometheus exposition of the engine metrics snapshot (`GET /metrics`).
# Additive and off by default: nothing in the default embedded build
# enables it, and the route additionally needs `krishiv.metrics.enabled`.
metrics-prometheus = ["dep:krishiv-exec"]
# `SessionSource`: the UI backend over an engine runtime (embedded mode), reading the system tables.
session = ["dep:krishiv-session", "dep:krishiv-common", "dep:arrow-array", "dep:arrow-schema"]
# The admin listener over TLS (`tls::serve_capped_tls`, P3-T002 design §3.5).
tls = ["dep:tokio-rustls", "krishiv-session?/tls"]

[dev-dependencies]
krishiv-session = { path = "../krishiv-session" }
krishiv-exec = { path = "../krishiv-exec" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }

[lints]
workspace = true

[[example]]
name = "console_capture"
required-features = ["session"]
