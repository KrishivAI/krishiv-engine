[package]
name = "krishiv-testkit"
description = "Conformance test harness: Spark goldens, batch==stream invariant, sqllogictest runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
bytes.workspace = true
futures = { workspace = true, features = ["alloc", "std"] }
jiff = { workspace = true, features = ["std", "tzdb-bundle-always"] }
krishiv-common = { path = "../krishiv-common" }
krishiv-exec = { path = "../krishiv-exec" }
krishiv-io = { path = "../krishiv-io" }
krishiv-kernels = { path = "../krishiv-kernels" }
krishiv-memory = { path = "../krishiv-memory" }
krishiv-plan = { path = "../krishiv-plan" }
object_store = { workspace = true, features = ["fs"] }
parquet = { workspace = true, features = ["arrow"] }
krishiv-sql = { path = "../krishiv-sql" }
krishiv-types = { path = "../krishiv-types" }
regex-lite.workspace = true
serde_json = { workspace = true, features = ["std"] }
sqllogictest.workspace = true
thiserror.workspace = true
# Paused time and a current-thread runtime for the file-format suite.
tokio = { workspace = true, features = ["rt", "time", "test-util"] }

[dev-dependencies]
insta = { workspace = true }
sha2.workspace = true
