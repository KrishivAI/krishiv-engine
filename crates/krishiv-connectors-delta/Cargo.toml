[package]
name = "krishiv-connectors-delta"
description = "Delta Lake connector"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
arrow-arith.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-cast.workspace = true
arrow-data.workspace = true
arrow-json.workspace = true
arrow-ord.workspace = true
arrow-row.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
futures = { workspace = true, features = ["std"] }
# Arrow feature off (its arrow-* features pull chrono-tz, banned by ADR 0028);
# `internal-api` has no dependencies.
delta_kernel = { workspace = true, features = ["internal-api"] }
bytes.workspace = true
chrono.workspace = true
# The zone database krishiv-kernels already bundles (same features): partition timestamps'
# zone names (chrono-tz is banned by ADR 0028).
jiff = { workspace = true, features = ["std", "tzdb-bundle-always"] }
krishiv-common = { path = "../krishiv-common", version = "=0.2.1" }
krishiv-exec = { path = "../krishiv-exec", version = "=0.2.1" }
krishiv-io = { path = "../krishiv-io", version = "=0.2.1" }
krishiv-memory = { path = "../krishiv-memory", version = "=0.2.1" }
krishiv-optimizer = { path = "../krishiv-optimizer", version = "=0.2.1" }
krishiv-plan = { path = "../krishiv-plan", version = "=0.2.1" }
krishiv-types = { path = "../krishiv-types", version = "=0.2.1" }
object_store.workspace = true
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["std"] }
url.workspace = true

[dev-dependencies]
async-trait.workspace = true
futures = { workspace = true, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
