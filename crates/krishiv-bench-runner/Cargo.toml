[package]
name = "krishiv-bench-runner"
description = "Bench-only query runner: drives krishiv-session for the bench harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "krishiv-bench-runner"
path = "src/main.rs"
doc = false

[dependencies]
arrow-array.workspace = true
arrow-row.workspace = true
arrow-schema.workspace = true
futures = { workspace = true, features = ["alloc", "executor"] }
krishiv-common = { path = "../krishiv-common" }
krishiv-exec = { path = "../krishiv-exec" }
krishiv-alloc = { path = "../krishiv-alloc" }
krishiv-memory = { path = "../krishiv-memory" }
krishiv-session = { path = "../krishiv-session" }
mimalloc.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[features]
# S3, GCS, Azure, https:// and hf:// tables (`--table NAME=URL`): the session's cloud stores. Needed by the
# remote-filter runs over s3:// and by T195; the default build refuses those URLs.
cloud = ["krishiv-session/cloud"]
# Count the live heap (`krishiv_alloc::heap`) and report its peak in PROFILE
# (`"peak_heap_bytes"`): a measurement build.
heap-stats = ["krishiv-alloc/heap-stats"]

[dev-dependencies]
parquet = { workspace = true, features = ["arrow"] }
proptest = { workspace = true, features = ["std"] }
tempfile.workspace = true
