[package]
name = "krishiv-udf-pool"
description = "Krishiv's isolated Python UDF worker pool: sandboxed worker processes, memfd transport and lifecycle"
readme = "README.md"
keywords.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
futures = { workspace = true, features = ["executor", "std"] }
krishiv-common = { path = "../krishiv-common", version = "=0.3.0" }
krishiv-exec = { path = "../krishiv-exec", version = "=0.3.0" }
krishiv-plan = { path = "../krishiv-plan", version = "=0.3.0" }
krishiv-types = { path = "../krishiv-types", version = "=0.3.0" }
krishiv-udf-sandbox = { path = "../krishiv-udf-sandbox", version = "=0.3.0" }
serde_json = { workspace = true, features = ["std"] }
tempfile.workspace = true
tracing = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs", "net", "process", "std"] }

[dev-dependencies]
# The compressed-result regression test writes an LZ4 stream.
arrow-ipc = { workspace = true, features = ["lz4"] }
# The UDTF golden replay reads the committed, gzipped export of its cases.
flate2.workspace = true
futures = { workspace = true, features = ["executor"] }
# The window and iterator golden replay runs SQL on a session over the pool.
krishiv-session = { path = "../krishiv-session" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
