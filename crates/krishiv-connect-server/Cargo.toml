[package]
name = "krishiv-connect-server"
description = "Spark Connect gRPC server: the service, session manager and limits"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
arrow-array.workspace = true
arrow-ipc = { workspace = true, features = ["lz4", "zstd"] }
arrow-schema.workspace = true
futures = { workspace = true, features = ["std"] }
bytes = { workspace = true, features = ["std"] }
krishiv-common = { path = "../krishiv-common", version = "=0.2.1" }
krishiv-connect = { path = "../krishiv-connect", version = "=0.2.1" }
krishiv-memory = { path = "../krishiv-memory", version = "=0.2.1" }
krishiv-plan = { path = "../krishiv-plan", version = "=0.2.1" }
krishiv-session = { path = "../krishiv-session", version = "=0.2.1", features = ["unstable-ir"] }
krishiv-types = { path = "../krishiv-types", version = "=0.2.1" }
getrandom.workspace = true
prost = { workspace = true, features = ["derive", "std"] }
prost-types = { workspace = true, features = ["std"] }
rustix.workspace = true
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tonic = { workspace = true, features = ["server", "router", "codegen"] }
tracing.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tonic = { workspace = true, features = ["channel", "server", "router", "codegen"] }
tonic-prost.workspace = true
