[package]
name = "krishiv-catalogs"
description = "External catalogs: Hive metastore and Unity Catalog (read-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The Hive metastore catalog (Thrift client). Off by default: the default build carries no Thrift runtime.
hive = ["dep:thrift", "dep:krishiv-plan", "dep:krishiv-types", "dep:krishiv-store", "dep:tokio"]
# The Iceberg REST catalog client (async reqwest over rustls on a thread of its own). Off by default.
iceberg-rest = ["dep:reqwest", "dep:serde_json", "dep:tokio", "dep:url", "tokio/time", "tokio/sync"]
# The Unity Catalog read-only client (async reqwest over rustls on a thread of its own). Off by default; shares no code with
# `iceberg-rest`, so either feature builds without the other.
unity = ["dep:reqwest", "dep:serde_json", "dep:tokio", "dep:url", "dep:krishiv-plan", "dep:krishiv-types", "tokio/time", "tokio/sync"]

# The embedded SQLite catalog (`rusqlite` with the bundled C amalgamation: a C build). Off by default.
sqlite = ["dep:rusqlite", "dep:serde_json", "dep:krishiv-plan", "dep:krishiv-types"]

[dependencies]
krishiv-common = { path = "../krishiv-common", version = "=0.2.1" }
krishiv-plan = { path = "../krishiv-plan", version = "=0.2.1", optional = true }
krishiv-types = { path = "../krishiv-types", version = "=0.2.1", optional = true }
# The egress address rule of the metastore connection (design P3-T067 §5.2).
krishiv-store = { path = "../krishiv-store", version = "=0.2.1", optional = true }
tracing.workspace = true
thrift = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
reqwest = { workspace = true, features = ["rustls"], optional = true }
serde_json = { workspace = true, features = ["std"], optional = true }
url = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true, features = ["alloc", "executor"] }
krishiv-plan = { path = "../krishiv-plan", version = "=0.2.1", features = ["testing"] }
tempfile.workspace = true
