[package]
name = "krishiv-catalogs"
description = "External catalogs behind the Krishiv catalog trait: embedded SQLite, Hive metastore, Iceberg REST"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[features]
# The Hive metastore catalog (Thrift client). Off by default: the default build carries no Thrift runtime.
hive = ["dep:thrift", "dep:krishiv-plan", "dep:krishiv-types", "dep:krishiv-store", "dep:tokio"]
# The Iceberg REST catalog client (async reqwest over rustls on a thread of its own, every request on krishiv-store's
# egress policy client). Off by default.
iceberg-rest = [
    "dep:reqwest",
    "dep:serde_json",
    "dep:tokio",
    "dep:url",
    "tokio/time",
    "tokio/sync",
    "dep:krishiv-store",
    "krishiv-store/cloud",
]
# The catalog factories of the session's registry (design P3-T067 §2.3): `iceberg-rest` declared catalogs.
# The declared tables' reads open through the Iceberg connector (design P3-T067 PR-58b).
session = [
    "iceberg-rest",
    "dep:krishiv-session",
    "dep:krishiv-sql",
    "dep:krishiv-plan",
    "dep:krishiv-exec",
    "dep:krishiv-connectors-iceberg",
    "dep:async-trait",
    "tokio/rt",
]
# The Unity Catalog read-only client (async reqwest over rustls on a thread of its own, every request on krishiv-store's
# egress policy client). Off by default; shares no code with
# `iceberg-rest`, so either feature builds without the other.
unity = [
    "dep:reqwest",
    "dep:serde_json",
    "dep:tokio",
    "dep:url",
    "dep:krishiv-plan",
    "dep:krishiv-types",
    "tokio/time",
    "tokio/sync",
    "dep:krishiv-store",
    "krishiv-store/cloud",
]

# Test helpers for other crates' tests (`testing::serve_s3`, a loopback S3 stand-in, and `write_s3_table`).
# Never in a product build.
testing = ["session", "krishiv-connectors-iceberg/testing"]

# The AWS Glue Data Catalog read-only client (JSON API over async reqwest, signed with SigV4 on `sha2`; no AWS SDK).
# Off by default; shares no code with `iceberg-rest` or `unity`.
glue = [
    "dep:reqwest",
    "dep:serde_json",
    "dep:tokio",
    "dep:url",
    "dep:sha2",
    "dep:krishiv-plan",
    "dep:krishiv-types",
    "tokio/time",
    "tokio/sync",
    "dep:krishiv-store",
    "krishiv-store/cloud",
]

# The embedded SQLite catalog (`rusqlite` with the bundled C amalgamation: a C build). Off by default.
sqlite = ["dep:rusqlite", "dep:serde_json", "dep:krishiv-plan", "dep:krishiv-types"]

[dependencies]
krishiv-common = { path = "../krishiv-common", version = "=0.3.0" }
krishiv-plan = { path = "../krishiv-plan", version = "=0.3.0", optional = true }
krishiv-types = { path = "../krishiv-types", version = "=0.3.0", optional = true }
# The egress address rule of the metastore connection (design P3-T067 §5.2).
krishiv-store = { path = "../krishiv-store", version = "=0.3.0", optional = true }
# The `TableProvider` a declared table's scan opens, and the Iceberg tables it opens (feature `session`).
krishiv-exec = { path = "../krishiv-exec", version = "=0.3.0", optional = true }
krishiv-connectors-iceberg = { path = "../krishiv-connectors-iceberg", version = "=0.3.0", optional = true }
# The `CatalogFactory` trait and the declarations it builds from (feature `session`).
krishiv-session = { path = "../krishiv-session", version = "=0.3.0", optional = true }
krishiv-sql = { path = "../krishiv-sql", version = "=0.3.0", optional = true }
tracing.workspace = true
# The vended-credential source of a declared table (`krishiv-store`'s `CredentialSource`) and the
# connector's async `RestCommitTransport` trait, implemented by a declared table's committer (feature `session`).
async-trait = { workspace = true, optional = true }
thrift = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
reqwest = { workspace = true, features = ["rustls"], optional = true }
serde_json = { workspace = true, features = ["std"], optional = true }
url = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true, features = ["alloc", "executor"] }
krishiv-plan = { path = "../krishiv-plan", version = "=0.3.0", features = ["testing"] }
tempfile.workspace = true
# The declared-table read tests serve a table the connector's test helper writes.
krishiv-connectors-iceberg = { path = "../krishiv-connectors-iceberg", version = "=0.3.0", features = ["testing"] }
arrow-array = { workspace = true }
