[package]
name = "krishiv-optimizer"
description = "Query optimizer"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
krishiv-common = { path = "../krishiv-common", version = "=0.2.1" }
krishiv-functions = { path = "../krishiv-functions", version = "=0.2.1" }
krishiv-kernels = { path = "../krishiv-kernels", version = "=0.2.1" }
krishiv-plan = { path = "../krishiv-plan", version = "=0.2.1" }
krishiv-types = { path = "../krishiv-types", version = "=0.2.1" }
krishiv-udf-sdk = { path = "../krishiv-udf-sdk", version = "=0.2.1" }

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
krishiv-plan = { path = "../krishiv-plan", features = ["testing"] }
krishiv-sql = { path = "../krishiv-sql" }
proptest = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[[bench]]
name = "optimize"
harness = false

[lints]
workspace = true
