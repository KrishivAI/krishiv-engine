[package]
name = "krishiv-python"
description = "Python bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
# An extension module has unresolved libpython symbols; it cannot be linked
# into a Rust test binary. Python-side tests live in python/tests; the
# pyo3-free Arrow C stream code is compiled into the `stream_ffi` test.
test = false

# The pyo3-free Arrow C stream code on its own (Miri, ASan, coverage).
[[test]]
name = "stream_ffi"
path = "src/stream/tests.rs"
doctest = false

[features]
# Default wheel: one abi3 wheel for CPython >= 3.11. The free-threaded (cp314t)
# build cannot use abi3, so it builds with
# `--no-default-features --features mimalloc`.
default = ["abi3-py311", "mimalloc"]
abi3-py311 = ["pyo3/abi3-py311"]
# mimalloc is the global allocator of the extension module (P2-T012).
mimalloc = ["dep:mimalloc"]

[dependencies]
arrow-array = { workspace = true, features = ["ffi"] }
arrow-data = { workspace = true, features = ["ffi"] }
arrow-schema = { workspace = true, features = ["ffi"] }
krishiv-common = { path = "../krishiv-common" }
krishiv-session = { path = "../krishiv-session" }
krishiv-sql = { path = "../krishiv-sql" }
krishiv-types = { path = "../krishiv-types" }
futures = { workspace = true, features = ["executor"] }
# `extension-module` is deprecated: maturin sets PYO3_BUILD_EXTENSION_MODULE.
pyo3 = { workspace = true, features = ["macros"] }
mimalloc = { workspace = true, optional = true }

# musl loads the extension with dlopen, where mimalloc's default initial-exec
# TLS model crashes at import (musllinux wheels segfaulted in `import krishiv`):
# use the local-dynamic model there.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { workspace = true, optional = true, features = ["local_dynamic_tls"] }

[dev-dependencies]
arrow-buffer.workspace = true
