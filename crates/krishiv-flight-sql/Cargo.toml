[package]
name = "krishiv-flight-sql"
description = "Arrow Flight SQL server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
krishiv-common = { path = "../krishiv-common", version = "=0.2.1" }
krishiv-memory = { path = "../krishiv-memory", version = "=0.2.1" }
arrow-array.workspace = true
arrow-flight = { workspace = true, features = ["flight-sql"] }
arrow-schema.workspace = true
futures = { workspace = true, features = ["std"] }
getrandom.workspace = true
tonic.workspace = true

[dev-dependencies]
krishiv-exec = { path = "../krishiv-exec", version = "=0.2.1" }
tokio = { workspace = true, features = ["rt", "macros"] }
