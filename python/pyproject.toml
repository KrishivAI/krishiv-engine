[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "krishiv"
description = "Krishiv: a Rust-native, Spark-compatible batch and streaming engine"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.maturin]
manifest-path = "../crates/krishiv-python/Cargo.toml"
module-name = "krishiv._native"
python-source = "."
# Default build is abi3-py310 (feature set in the crate). The free-threaded
# wheel is built separately; see README.md.
