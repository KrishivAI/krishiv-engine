[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "krishiv"
description = "Krishiv: a Rust-native, Spark-compatible batch and streaming engine"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dynamic = ["version"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
# Arrow libraries are optional: `__arrow_c_stream__` needs none (Polars and DuckDB consume it
# directly); pyarrow is needed by `toArrow`, which imports it lazily. `toPandas` needs the
# `pandas` extra (pandas and numpy; not bundled in the wheel).
pyarrow = ["pyarrow>=16"]
pandas = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=16"]

[dependency-groups]
dev = [
    # Arrow PyCapsule consumers/producers the bridge tests run against.
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=16",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff==0.17.1",
    "ty==0.0.89",
]

[tool.maturin]
manifest-path = "../crates/krishiv-python/Cargo.toml"
module-name = "krishiv._native"
python-source = "."
# Default build is abi3-py311 (feature set in the crate). The free-threaded
# wheel is built separately; see README.md.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["krishiv"]
branch = true
relative_files = true
parallel = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.analysis]
# The compiled extension only exists after `maturin develop`; its typed stub is
# P2-T130's job, so until then the import is allowed to stay unresolved.
allowed-unresolved-imports = ["krishiv._native"]

[tool.coverage.paths]
# The wheel is tested from its installed location; map it back to the source tree so
# reports (and Codecov) show repository paths.
source = ["python/krishiv", "*/site-packages/krishiv"]
