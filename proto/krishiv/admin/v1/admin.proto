// SPDX-License-Identifier: Apache-2.0
//
// krishiv.admin.v1: the control API of `krishiv server` (design P3-T066, ADR 0036, ADR 0046).
// One service, two transports: gRPC and REST under /api/admin/v1 (the proto3 JSON mapping of
// these messages). Additive only (design §6.1): fields are never removed, renumbered, renamed or
// retyped; enums start with *_UNSPECIFIED = 0 and only gain values; one request and one response
// message per RPC; new intent is a new RPC. The REST verb and path of each RPC, and the privilege it
// checks, are in `crates/krishiv-server/admin-v1/routes.json` (the router and the OpenAPI document
// read it). Until the first release that ships it the surface is
// `preview` (design D8). `cargo xtask admin-api` checks the descriptor against the base branch.
syntax = "proto3";

package krishiv.admin.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service AdminService {
  // The engine version and the revision of this surface. Any authenticated caller.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);

  // The `system.capabilities` rows. Any authenticated caller.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);

  // The caller's own sessions, or every session with `Monitor` (the rows of `system.sessions`).
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // Ends a session and cancels its queries: one's own, or any with `Operate`.
  rpc KillSession(KillSessionRequest) returns (KillSessionResponse);

  // The caller's own queries, or every query with `Monitor` (the rows of `system.queries`).
  rpc ListQueries(ListQueriesRequest) returns (ListQueriesResponse);

  // Cancels one query: one's own, or any with `Operate`.
  rpc CancelQuery(CancelQueryRequest) returns (CancelQueryResponse);

  // Cancels the queries carrying a tag selector (`k` or `k=v`). Without `Operate` it matches only
  // the caller's own queries; what comes back never depends on other principals' queries.
  rpc CancelQueriesByTag(CancelQueriesByTagRequest) returns (CancelQueriesByTagResponse);

  // Per-check readiness detail (what `/readyz` summarizes). Needs `Monitor`.
  rpc GetReadiness(GetReadinessRequest) returns (GetReadinessResponse);

  // The drain state, deadline and the work still held. Needs `Monitor`.
  rpc GetDrainStatus(GetDrainStatusRequest) returns (GetDrainStatusResponse);

  // Starts a drain (or shortens a running one): `/readyz` answers 503, new work is refused with
  // `KRISHIV_SERVER_DRAINING`, held work finishes until the deadline and is then cancelled. Needs
  // `Manage` on the cluster.
  rpc Drain(DrainRequest) returns (DrainResponse);

  // Back to serving from `DRAINING` or `DRAINED`; refused with `exiting` once the process is going
  // to exit. Needs `Manage` on the cluster.
  rpc ResumeServing(ResumeServingRequest) returns (ResumeServingResponse);

  // The resource groups the caller may see (`system.resource_groups`): every group with
  // `Monitor`, else the caller's own groups and their ancestors with the subtree counters unset.
  rpc ListResourceGroups(ListResourceGroupsRequest) returns (ListResourceGroupsResponse);

  // The loaded resource group document, its etag and the etag of the file on disk. Needs
  // `Monitor`.
  rpc GetResourceGroupConfig(GetResourceGroupConfigRequest) returns (GetResourceGroupConfigResponse);

  // Runs the group loader on a candidate document and changes nothing. Needs `Monitor`.
  rpc ValidateResourceGroupConfig(ValidateResourceGroupConfigRequest) returns (ValidateResourceGroupConfigResponse);

  // Writes the document over the group file and swaps the tree; refused for a stale etag, a file
  // edited since it was loaded, or a file that cannot be replaced. Needs `Manage` on the cluster.
  rpc ReplaceResourceGroupConfig(ReplaceResourceGroupConfigRequest) returns (ReplaceResourceGroupConfigResponse);

  // Re-reads the group file; an invalid file is refused and the old tree stays. Needs `Manage` on
  // the cluster.
  rpc ReloadResourceGroupConfig(ReloadResourceGroupConfigRequest) returns (ReloadResourceGroupConfigResponse);

  // The configuration the server runs with: value, scope, who may set it, where it comes from.
  // Needs `Monitor`; values that say how to become an administrator are withheld.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

  // Changes the session defaults of new sessions, all or none. Needs `Manage` on the cluster.
  rpc SetConfigDefaults(SetConfigDefaultsRequest) returns (SetConfigDefaultsResponse);
}

message GetVersionRequest {}

message GetVersionResponse {
  // The engine's version, as `/api/v1/version` reports it.
  string version = 1;
  // An integer that grows whenever this surface's descriptor changes (design §6.3): a client that
  // needs a field checks it first.
  int64 admin_v1_revision = 2;
  // True until the first release that ships admin.v1 (design D8): the surface may still change.
  bool preview = 3;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  repeated Capability capabilities = 1;
}

// One row of `system.capabilities`.
message Capability {
  string kind = 1;
  string name = 2;
  string value = 3;
  string detail = 4;
}

// A session as `system.sessions` shows it.
message Session {
  string session_id = 1;
  string principal = 2;
  // The service principal acting for `principal` (trusted impersonation), if any.
  string delegated_by = 3;
  // Client-asserted.
  string client_type = 4;
  // `connect`, `flight_sql` or `embedded`.
  string transport = 5;
  // `open`, `closed`, `expired` or `killed`.
  string state = 6;
  google.protobuf.Timestamp created = 7;
  google.protobuf.Timestamp last_active = 8;
  // Set when the session ended.
  google.protobuf.Timestamp closed = 9;
  // `release_session`, `idle_timeout`, `admin_kill` or `drain`, when it ended.
  string close_reason = 10;
  map<string, string> tags = 11;
  int64 queries_running = 12;
  int64 queries_started = 13;
}

message ListSessionsRequest {
  // At most this many rows (default 100, clamped to 1,000).
  int32 page_size = 1;
  // From `next_page_token` of the previous page; bound to this request's filters.
  string page_token = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  // Empty at the end.
  string next_page_token = 2;
}

message KillSessionRequest {
  string session_id = 1;
  // Makes a retry safe: the same id with the same request returns the first response.
  string request_id = 2;
}

message KillSessionResponse {
  // The queries the kill cancelled.
  int64 queries_cancelled = 1;
}

// A query as `system.queries` shows it.
message Query {
  string query_id = 1;
  string session_id = 2;
  string principal = 3;
  // `queued`, `running`, `finished`, `failed`, `cancelled` or `denied`.
  string state = 4;
  // `READ`, `WRITE`, `DDL`, `SESSION` or `ADMIN`, when classified.
  string statement_class = 5;
  // Cut and masked by the session's text policy.
  string text = 6;
  google.protobuf.Timestamp submitted = 7;
  google.protobuf.Timestamp started = 8;
  google.protobuf.Timestamp ended = 9;
  string error_class = 10;
  string resource_group = 11;
  map<string, string> tags = 12;
}

message ListQueriesRequest {
  int32 page_size = 1;
  string page_token = 2;
  // Keeps these states; empty means `running` and `queued`.
  repeated string states = 3;
  // Keeps the queries of this session.
  string session_id = 4;
  // Keeps the queries of this principal.
  string principal = 5;
  // Keeps the queries carrying this tag selector (`k` or `k=v`).
  string tag = 6;
}

message ListQueriesResponse {
  repeated Query queries = 1;
  string next_page_token = 2;
}

message CancelQueryRequest {
  string query_id = 1;
  string request_id = 2;
}

message CancelQueryResponse {}

message CancelQueriesByTagRequest {
  // `k` or `k=v`.
  string selector = 1;
  string request_id = 2;
}

message CancelQueriesByTagResponse {
  // The queries cancelled.
  repeated string query_ids = 1;
}

message GetReadinessRequest {}

// One readiness check.
message ReadinessCheck {
  // `serving`, `auth`, `warehouse`, ...
  string name = 1;
  // `ok`, `failed` or `unknown` (not run yet).
  string state = 2;
  // Whether a failure of this check fails `/readyz` (`krishiv.server.readiness.required`).
  bool required = 3;
  int32 consecutive_failures = 4;
}

message GetReadinessResponse {
  // What `/readyz` answers: true for 200.
  bool ready = 1;
  repeated ReadinessCheck checks = 2;
}

message GetDrainStatusRequest {}

message DrainStatus {
  // `serving`, `draining` or `drained`.
  string state = 1;
  // When held work is cancelled, while draining.
  google.protobuf.Timestamp deadline = 2;
  // Whether the process exits once drained.
  bool exit_when_drained = 3;
  // Queries running or queued.
  int64 queries_running = 4;
  // Sessions open.
  int64 sessions_open = 5;
}

message GetDrainStatusResponse {
  DrainStatus status = 1;
}

message DrainRequest {
  // Defaults to `krishiv.server.shutdownTimeout`. A second drain may shorten the deadline, never
  // extend it.
  google.protobuf.Duration grace_period = 1;
  // Exit the process once drained. A second drain may turn it on, never off.
  bool exit_when_drained = 2;
  string request_id = 3;
}

message DrainResponse {
  DrainStatus status = 1;
}

message ResumeServingRequest {
  string request_id = 1;
}

message ResumeServingResponse {
  DrainStatus status = 1;
}

message ResourceGroup {
  // Dotted path, `root.etl.nightly`.
  string group_id = 1;
  // Empty for a root.
  string parent_id = 2;
  // `active`, or `removed` (left by a reload, still holding queries).
  string state = 3;
  string scheduling_policy = 4;
  int32 scheduling_weight = 5;
  int32 priority = 6;
  string workload_class = 7;
  int32 hard_concurrency_limit = 8;
  int32 max_queued = 9;
  // The limits below are unset when the group has none.
  optional int64 soft_memory_limit_bytes = 10;
  optional int64 per_query_memory_limit_bytes = 11;
  optional int64 scan_quota_bytes = 12;
  optional int64 scan_quota_period_s = 13;
  // The subtree counters are unset on an ancestor row of a caller without `Monitor`.
  optional int32 running = 14;
  optional int32 queued = 15;
  optional int64 memory_reserved_bytes = 16;
  optional int64 scan_bytes_in_window = 17;
  google.protobuf.Timestamp scan_window_resets_at = 18;
  string config_etag = 19;
  google.protobuf.Timestamp loaded_at = 20;
}

message ListResourceGroupsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListResourceGroupsResponse {
  repeated ResourceGroup groups = 1;
  string next_page_token = 2;
}

message GetResourceGroupConfigRequest {}

message GetResourceGroupConfigResponse {
  // The canonical JSON; empty when no group file is configured.
  string document = 1;
  // SHA-256 (hex) of the canonical JSON.
  string etag = 2;
  google.protobuf.Timestamp loaded_at = 3;
  // The etag of the file as it is on disk now; empty when it cannot be read.
  string file_etag = 4;
}

message ValidateResourceGroupConfigRequest {
  string document = 1;
}

message ConfigProblem {
  // The error class of the refusal.
  string error_class = 1;
  string message = 2;
  // Where in the document, as `rootGroups[1].subGroups[0].name`; empty when it is the document.
  string path = 3;
}

message ValidateResourceGroupConfigResponse {
  bool valid = 1;
  repeated ConfigProblem problems = 2;
}

message ReplaceResourceGroupConfigRequest {
  string document = 1;
  // The etag the caller read; a stale one is refused with `KRISHIV_ADMIN_PRECONDITION_FAILED`.
  string etag = 2;
  string request_id = 3;
}

message ReplaceResourceGroupConfigResponse {
  // The etag and load time of the document now in force.
  string etag = 1;
  google.protobuf.Timestamp loaded_at = 2;
}

message ReloadResourceGroupConfigRequest {
  string request_id = 1;
}

message ReloadResourceGroupConfigResponse {
  string etag = 1;
  google.protobuf.Timestamp loaded_at = 2;
}

message ConfigEntry {
  string key = 1;
  // Unset when the key has no value or the value is withheld.
  optional string value = 2;
  // `session` or `cluster`; empty for a startup key the registry does not know.
  string scope = 3;
  // `startup`, `admin` or `user`; empty for a key the registry does not know.
  string settable_by = 4;
  // `default`, `startup` or `admin`.
  string source = 5;
  // The value is hidden because the caller may not see it.
  bool withheld = 6;
}

message GetConfigRequest {
  // Keeps the keys that start with this prefix.
  string prefix = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetConfigResponse {
  repeated ConfigEntry entries = 1;
  string next_page_token = 2;
}

message SetConfigDefaultsRequest {
  // Key to value; applied to sessions created afterwards.
  map<string, string> set = 1;
  // Keys that return to their startup value.
  repeated string unset = 2;
  string request_id = 3;
}

message SetConfigDefaultsResponse {
  // The keys set and unset.
  int32 set_count = 1;
  int32 unset_count = 2;
}
