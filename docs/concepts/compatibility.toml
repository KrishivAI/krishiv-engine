name = "Writing ORC (`df.write.orc`, `format(\"orc\").save`)"
status = "not yet"
note = "Fails with KRISHIV_UNSUPPORTED_FEATURE; `df.write.orc` does not exist."

[[surface]]
group = "SQL"
name = "`bucketBy` on writes"
status = "not yet"
note = "Fails with a clear unsupported-feature error."

[[surface]]
group = "SQL"
name = "DataFrameWriterV2 (`writeTo`)"
status = "partial"
note = "`create` and `append` work in a Python session. `createOrReplace` and `replace` fail as REPLACE TABLE AS SELECT does; `overwrite(condition)` and `overwritePartitions` always fail with KRISHIV_UNSUPPORTED_FEATURE; `partitionedBy` and `clusterBy` fail when the write runs. Spark Connect clients cannot use `writeTo` yet."

[[surface]]
group = "SQL"
name = "Spark version"
status = "partial"
note = "Krishiv 0.3 runs as Spark 4.3 by default (the Spark 4.2 profile is selectable); Spark 3.5, 4.0 and 4.1 behaviour is not selectable yet."

[[surface]]
group = "User-defined functions"
name = "Python `@udf` and scalar `pandas_udf` / `arrow_udf`"
status = "supported"
note = ""

[[surface]]
group = "User-defined functions"
name = "Grouped-aggregate `pandas_udf`, `applyInPandas`, `mapInPandas`, `cogroup`"
status = "supported"
note = "Embedded relation UDFs run on the Python pool, one pool thread per task (`krishiv.python.udf.threads`). `barrier=True` is refused. Grouped-aggregate UDFs over a window (`.over(window)`) are refused."

[[surface]]
group = "User-defined functions"
name = "Scalar-iterator `pandas_udf` / `arrow_udf`"
status = "not yet"
note = "Refused as NOT_IMPLEMENTED when embedded."

