# typos (spell checker) configuration. CI: `typos`.
[files]
extend-exclude = [
    "target/**",
    ".github/ci-fixtures/**",
    "tests/spark-golden/**",
    "tests/fixtures/**",
    "crates/*/tests/fixtures/**",
    "crates/krishiv-common/vendored/spark-error-conditions.json",
    "crates/krishiv-types/vendored/collations.tsv",
    # generated Java zone-name table (PONT, TAHT)
    "crates/krishiv-kernels/src/datetime_pattern/zone_names.rs",
    "proto/spark-connect/**",
    "crates/krishiv-connect/src/proto/**",
    "tests/sqllogictest/**",
    "crates/krishiv-ui-assets/assets/**",
    "**/*.lock",
    "**/pnpm-lock.yaml",
    "**/*.out",
    "**/*.sql",
]

[default]
extend-ignore-re = [
    '"(ECT|IST)"',         # Java's short time-zone IDs (Europe/Paris, Asia/Kolkata)
    'spark\.implicits\._', # Spark's implicit-conversions import
    '"Bash\([^"]*\)"',     # command patterns in agent permission rules (bundled git options like -nam)
]

[default.extend-identifiers]
# The ClickBench `hits` column name as the dataset spells it; the queries refer to it.
TraficSourceID = "TraficSourceID"

[default.extend-words]
# Spark / Arrow / project vocabulary that looks like a typo.
nd = "nd"                   # "nondeterministic" shorthand in the function-matrix generator
unparseable = "unparseable" # key in committed function-matrix manifest
ba = "ba"
sesion = "sesion"           # invalid qualifier in the session-variable golden (`system.sesion.var1`)
sesson = "sesson"           # invalid qualifier in the session-variable golden (`b.sesson.var1`)
WRONLY = "WRONLY"           # `OFlags::WRONLY` (write-only open flag) in the anchored store
selct = "selct"             # intentional misspelling in the syntax-error golden (error is at EXECUTE, not inside)
