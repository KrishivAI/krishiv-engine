# Lint/type-check configuration only: these generator scripts are run directly
# (and by `tests/scripts/test_*.py`), they are not a package. CI runs ruff and ty
# from the `python/` dev environment with `--config`/`--config-file` pointing here.
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.analysis]
# Heavy third-party dependencies live in the bench environment (`bench/pyproject.toml`);
# the generator scripts import them lazily and are only run there, not in the lint environment.
allowed-unresolved-imports = ["pyspark.**", "numpy.**", "pyarrow.**", "google.**"]
