[project]
name = "krishiv-bench"
version = "0.1.0"
description = "Krishiv benchmark harness (P0-T19): runs query suites against engine adapters"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "duckdb>=1.3",
  "pyarrow>=17",
  "numpy>=2",
  "psutil>=6",
  "pyspark[connect]==4.2.0",
  "grpcio",
  "grpcio-status",
  "protobuf",
  "pandas<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
krishiv-bench = "krishiv_bench.cli:main"
krishiv-datasets = "krishiv_bench.datasets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishiv_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
