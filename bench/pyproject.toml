[project]
name = "krishiv-bench"
version = "0.1.0"
description = "Krishiv benchmark harness (P0-T19): runs query suites against engine adapters"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "duckdb==1.5.6",
  "pyarrow>=17",
  "numpy>=2",
  "psutil>=6",
  "pyspark[connect]==4.2.0",
  "grpcio",
  "grpcio-status",
  "protobuf",
  "pandas<3",
  "polars==2.0.0",
  "datafusion==55.0.0",
  "pysail==0.7.2",
  "chdb==4.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff==0.17.1",
    "ty==0.0.89",
]

[project.scripts]
krishiv-bench = "krishiv_bench.cli:main"
krishiv-datasets = "krishiv_bench.datasets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishiv_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# Report unimported files in directories without __init__.py too, so a new
# untested module counts against the diff-coverage gate.
include_namespace_packages = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
# Markdown report templates: long prose/f-string lines that ruff format cannot (and should not) wrap.
"src/krishiv_bench/report.py" = ["E501"]

[tool.ty.environment]
python-version = "3.11"
