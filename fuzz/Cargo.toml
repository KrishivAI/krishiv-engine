# cargo-fuzz targets (nightly toolchain, libFuzzer); a workspace of its own,
# outside the product workspace and its dependency gates. Run with
# `cargo +nightly fuzz run <target>` from this directory.
[package]
name = "krishiv-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# `capsule_import` includes crates/krishiv-python/src/stream/ffi.rs by path, which is what
# uses these two; cargo-machete cannot see through the path include.
[package.metadata.cargo-machete]
ignored = ["arrow-data", "krishiv-common"]

[dependencies]
libfuzzer-sys = "0.4.10"
prost = "0.14.4"
arrow-array = { version = "60", default-features = false, features = ["ffi"] }
arrow-buffer = { version = "60", default-features = false }
arrow-data = { version = "60", default-features = false, features = ["ffi"] }
arrow-schema = { version = "60", default-features = false, features = ["ffi"] }
krishiv-common = { path = "../crates/krishiv-common" }
krishiv-connect = { path = "../crates/krishiv-connect" }
krishiv-io = { path = "../crates/krishiv-io" }
krishiv-memory = { path = "../crates/krishiv-memory" }
krishiv-plan = { path = "../crates/krishiv-plan", features = ["testing"] }
krishiv-sql = { path = "../crates/krishiv-sql" }
krishiv-types = { path = "../crates/krishiv-types" }
krishiv-testkit = { path = "../crates/krishiv-testkit" }
object_store = { version = "=0.14.2", default-features = false }
tokio = { version = "1.53", default-features = false, features = ["rt", "time"] }

[[bin]]
name = "sql_parse"
path = "fuzz_targets/sql_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "connect_decode"
path = "fuzz_targets/connect_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parquet_read"
path = "fuzz_targets/parquet_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capsule_import"
path = "fuzz_targets/capsule_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "planted_panic"
path = "fuzz_targets/planted_panic.rs"
test = false
doc = false
bench = false

[workspace]
