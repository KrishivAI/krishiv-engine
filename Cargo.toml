[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
# MSRV = latest stable (1.99) minus two minor releases.
rust-version = "1.97"
license = "Apache-2.0"                                   # ADR 0033
repository = "https://github.com/krishiv/krishiv-engine"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
# `--cfg loom` builds the loom model tests (krishiv-memory, krishiv-exec);
# `cargo codspeed` builds benches with `--cfg codspeed`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(codspeed)", "cfg(tokio_unstable)", "cfg(coverage)"] }
# ADR 0029 (2026-10-17 lint set).
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# `clippy.toml` bans blocking calls, but only crates that need the ban
# deny the lint at their root (`krishiv-exec`, whose compute workers must
# never block, and `krishiv-connect`, whose bounded prost decoder is the
# only allowed decoder of untrusted bytes): everywhere else a compute
# worker never runs, including build scripts and benches, so the ban stays
# silent there even under `-D warnings`.
disallowed_methods = "allow"
panic = "deny"
# Exceptions only via `#[expect(lint, reason = "...")]`, never a bare `allow` (ADR 0029).
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
clone_on_ref_ptr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
mem_forget = "deny"
rc_buffer = "deny"
unwrap_in_result = "warn"
if_then_some_else_none = "warn"
redundant_clone = "warn"
# Curated pedantic subset (ADR 0029); CI runs clippy with -D warnings.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"

# Single source of dependency versions (ADR 0028). Declared with
# `default-features = false`; members opt in to features explicitly.
# Unused entries cost nothing: they are not resolved or compiled.
[workspace.dependencies]
arrow-array = { version = "60", default-features = false }
arrow-buffer = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
arrow-select = { version = "60", default-features = false }
arrow-string = { version = "60", default-features = false }
arrow-ord = { version = "60", default-features = false }
arrow-row = { version = "60", default-features = false }
arrow-data = { version = "60", default-features = false }
arrow-ipc = { version = "60", default-features = false }
arrow-flight = { version = "60", default-features = false }
parquet = { version = "60", default-features = false }
# object_store is pinned to the version delta_kernel 0.30 builds against (ADR 0028
# update 2026-10-17); never enable parquet's `object_store` feature (deny.toml).
# Cloud TLS (the `aws`, `gcp` and `azure` features) is opt-in through
# `krishiv-io/cloud`: it brings reqwest over rustls (aws-lc-rs) and its HTTP
# stack, which would otherwise blow the dependency and binary-size budgets for
# the default build. OpenSSL stays banned (deny.toml).
object_store = { version = "=0.14.2", default-features = false }
# Avro container files (P2-T081b): datum encode/decode, codecs and schema
# parsing. Only the pure-Rust codecs are enabled (deflate is built in;
# snappy needs no OpenSSL). The `zstandard` feature stays off: it pulls
# zstd 0.13, which carries RUSTSEC-2026-0391, and no apache-avro release
# allows zstd 0.14; zstandard, bzip2 and xz files are refused.
apache-avro = { version = "=0.22.0", default-features = false, features = ["snappy"] }
# Implementing `object_store::ObjectStore` (an `async_trait` trait) for store
# wrappers; already in the tree through object_store itself.
async-trait = { version = "0.1.89", default-features = false }
# Only for object_store's `if_unmodified_since` precondition (chrono 0.4.45 comes
# with Arrow/object_store, ADR 0028).
chrono = { version = "0.4.42", default-features = false }
tokio = { version = "1.53", default-features = false }
tonic = { version = "0.14.6", default-features = false }
prost = { version = "0.14.4", default-features = false }
prost-types = { version = "0.14.4", default-features = false }
pyo3 = { version = "0.30.1", default-features = false }
hashbrown = { version = "0.17", default-features = false }
foldhash = { version = "0.2", default-features = false }
# Digests of the md5/sha1/sha2 SQL functions (kernels); sha2 also checksums interoperability fixtures.
md5 = { package = "md-5", version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
libm = { version = "0.2", default-features = false }
xxhash-rust = { version = "0.8", default-features = false }
twox-hash = { version = "2.1", default-features = false }
crossbeam-deque = { version = "0.8.8", default-features = false }
crossbeam-channel = { version = "0.5.17", default-features = false }
parking_lot = { version = "0.12", default-features = false }
bytes = { version = "1.12", default-features = false }
futures = { version = "0.3.34", default-features = false }
roaring = { version = "0.11", default-features = false }
smallvec = { version = "1.16", default-features = false }
lz4_flex = { version = "0.14", default-features = false }
zstd = { version = "0.14", default-features = false }
regex = { version = "1.13", default-features = false }
regex-automata = { version = "0.4", default-features = false }
regex-syntax = { version = "0.8", default-features = false }
fancy-regex = { version = "0.19", default-features = false }
memchr = { version = "2.8", default-features = false }
jiff = { version = "0.2.38", default-features = false }
slatedb = { version = "0.17", default-features = false }
foyer = { version = "0.22.6", default-features = false }
delta_kernel = { version = "0.30", default-features = false }
iceberg = { version = "0.10.1", default-features = false }
rdkafka = { version = "0.39", default-features = false }
wasmtime = { version = "49", default-features = false }
axum = { version = "0.8.9", default-features = false }
tower = { version = "0.5.3", default-features = false }
rust-embed = { version = "8.13", default-features = false }
utoipa = { version = "6.0", default-features = false }
rmcp = { version = "3.5.1", default-features = false }
rustls = { version = "0.23", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false }
# Benchmarks: drop-in criterion replacement that CodSpeed instruments (dev-dependency only).
criterion = { package = "codspeed-criterion-compat", version = "5.0", default-features = false }
insta = { version = "1.48", default-features = false }
regex-lite = { version = "0.1", default-features = false, features = ["std", "string"] }
sqllogictest = { version = "0.29", default-features = false }
# Property tests (dev-dependency only).
proptest = { version = "1.9", default-features = false }
# Protobuf JSON for the golden tests of krishiv-connect (dev-dependency only).
prost-reflect = { version = "0.16.5", default-features = false }
# Concurrency model checking (dev-dependency only, under `--cfg loom`).
loom = { version = "0.7", default-features = false }
# Self-removing test directories (dev-dependency only).
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std"] }
tempfile = { version = "3.27", default-features = false }
thiserror = { version = "2.0", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.154", default-features = false }
mimalloc = { version = "0.1.52", default-features = false }
# FFI crate of mimalloc; dev-dependency only, for the allocator-linked test (P2-T012).
libmimalloc-sys = { version = "0.1.49", default-features = false }
clap = { version = "4.6", default-features = false }
# Live async-task diagnostics (`tokio-console`, P2-T129): off by default, see
# `crates/krishiv-exec/src/console.rs`.
console-subscriber = { version = "0.5.0", default-features = false }
reedline = { version = "0.52", default-features = false }
uuid = { version = "1.28", default-features = false }

# Distribution artifacts (Python wheels, size budget, benchmark runner). `release` stays
# the fast developer profile. Fat LTO: measured 1.7% faster on TPC-H SF10 (paired A/B,
# 95% CI 0.976-0.997; up to 10% on single queries) and ~5% smaller than thin LTO, for a
# longer link step. panic stays "unwind": the Python bridge catches panics at the FFI
# boundary with `catch_unwind`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Benchmarks (`cargo bench`, `cargo codspeed build`) use the same codegen as the shipped
# `dist` profile, except strip. With the default 16 codegen units an unrelated module
# flipped an inlining decision and slowed `aggregate/grouped_sum` by 8-9%; with
# codegen-units = 1 (the shipped setting) the effect disappears. Keep codegen-units in
# step with [profile.dist]. LTO stays thin here: every benchmark binary is linked
# separately, and fat LTO pushed the benchmark build past its CI time limit; the
# benchmarks compare builds made the same way, so the LTO mode does not affect them.
# Cargo ignores `panic` for bench builds, which always unwind, so it is not set here.
[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 1
