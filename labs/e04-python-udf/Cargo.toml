[workspace]
# Standalone lab workspace (excluded from the root workspace via `exclude = ["labs"]`).

[package]
name = "e04-python-udf"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
arrow = { version = "60", default-features = false, features = ["ffi", "ipc"] }
pyo3 = { version = "0.30", features = ["auto-initialize"] }
serde_json = "1"
libc = "0.2"
memmap2 = "0.9"

[build-dependencies]
pyo3-build-config = "0.30"

[profile.release]
debug = 1
