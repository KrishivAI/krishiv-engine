# Codecov configuration (P2-T105, ADR 0029). Codecov is INFORMATIONAL only:
# nothing here blocks a merge. The merge gate is our own diff-coverage check
# (`cargo xtask diff-coverage`, switched on at P2a exit as P2-T105b).
codecov:
  require_ci_to_pass: false

coverage:
  precision: 1
  round: down
  range: "60...90"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  behavior: default
  require_changes: false

github_checks:
  annotations: false

ignore:
  - "**/tests/**"
  - "**/tests.rs"
  - "xtask/**"

# Flags (P2-T151). `python` is pytest --cov of the wheel; `rust` is the Rust test suite
# (`pr` and `nightly` uploads); `rust-from-python` is Rust reached via the Python API
# (nightly, instrumented extension). Carryforward keeps a flag's last value when a
# commit did not upload it (path-filtered PR runs, nightly-only flags).
flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        informational: true
      - type: patch
        informational: true
  individual_flags:
    - name: python
      paths:
        - python/
    - name: rust
      paths:
        - crates/
    - name: rust-from-python
      paths:
        - crates/
