# Reusable no-op, called from osv-scanner.yml on merge-queue runs so the required
# check `scan-pr / osv-scan` is reported (the real scan ran on the pull request).
name: Merge-group no-op

on:
  workflow_call:

permissions: {}

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Checked on the pull request; nothing to redo for the merge group."
