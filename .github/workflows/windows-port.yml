name: Windows port

# The Windows x86-64 port (owner 2026-11-23, 0.3.0 scope; lane opus-3): sizes and tracks what fails to build and test
# on windows-latest (x86_64-pc-windows-msvc) while the platform code gets its cfg(windows) halves. Runs only on the
# port branch; sonnet-8's wheels/binaries matrix and the Windows test job in ci.yml replace it once the port merges.
on:
  push:
    branches: [p3/o3-windows-port]

concurrency:
  group: windows-port-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Every crate that can be checked is checked (--keep-going), so one run lists every error.
      - name: cargo check (workspace, all targets)
        id: check
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --locked --keep-going --message-format=short 2>&1 | tee check.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          errors=$(grep -c '^[^ ]*: error\|^error' check.log || true)
          crates=$(grep -o 'could not compile `[^`]*`' check.log | sort -u | tr '\n' ' ' || true)
          {
            echo "## Windows port: cargo check"
            echo "error lines: ${errors}"
            echo "crates that did not compile: ${crates:-none}"
            echo '```'
            grep '^[^ ]*: error\|^error' check.log | sort | uniq -c | sort -rn | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-check-log
          path: check.log
          retention-days: 7
      - name: Fail when the check failed
        if: steps.check.outcome == 'failure'
        shell: bash
        run: exit 1

  # The workspace tests, every failure listed (--no-fail-fast); the log is the artifact windows-test-log.
  test:
    runs-on: windows-latest
    timeout-minutes: 180
    # Run 4 filled the runner's 147 GB D: drive (each of ~480 test executables links statically with its own PDB)
    # and link.exe hit the PDB size limit (LNK1140). As in ci.yml's Linux test job, the test build carries no debug
    # info, and the run is split: krishiv-session (303 test binaries) runs after the other crates' test executables
    # are removed.
    env:
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test
      - uses: ./.github/actions/install-tool
        with:
          tool: cargo-nextest
      - name: Disk before
        shell: bash
        run: df -h . || true
      - name: cargo nextest (workspace)
        id: test
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          cargo nextest run --workspace --exclude krishiv-session --locked --no-tests=pass --no-fail-fast 2>&1 \
            | tee test.log || status=1
          df -h . || true
          find target/debug/deps -maxdepth 1 -type f \( -name '*.exe' -o -name '*.pdb' \) -delete
          df -h . || true
          cargo nextest run -p krishiv-session --locked --no-tests=pass --no-fail-fast 2>&1 | tee -a test.log || status=1
          exit "$status"
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows port: cargo nextest"
            grep -E '^ *Summary ' test.log || echo "no nextest summary (build failure?)"
            echo '```'
            grep -E '^ *(FAIL|TIMEOUT|SIGSEGV|ABORT) ' test.log | sort -u | head -200 || true
            grep -o 'could not compile `[^`]*`' test.log | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          df -h . || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-test-log
          path: test.log
          retention-days: 7
      - name: Fail when tests failed
        if: steps.test.outcome == 'failure'
        shell: bash
        run: exit 1
