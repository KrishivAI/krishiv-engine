name: OSV-Scanner

# Known-vulnerability scan of the lock files (Cargo and uv) with OSV-Scanner.
# The lock files are found by walking the tree (the web UI's pnpm lock file is
# excluded), not listed: a pull request scans its base with the same
# arguments, so a listed lock file that a pull request adds does not exist
# there and fails the base scan ("failed to resolve path"), whatever it holds.
# Pull requests fail only on vulnerabilities they introduce (base vs head);
# the weekly schedule scans everything and uploads SARIF to code
# scanning. The scan runs in Google's reusable workflows, so its jobs cannot
# take a Harden-Runner step of ours.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: osv-scanner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    permissions:
      # Required by the reusable workflow: read the code and its runs,
      # upload SARIF to code scanning.
      actions: read
      contents: read
      security-events: write
    with:
      # Fork pull requests get a read-only token: report in the job only.
      upload-sarif: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      scan-args: |-
        --recursive
        --experimental-exclude=ui
        ./

  # Merge queue: the pull-request scan diffs against the PR base branch, which a
  # merge-group run does not have, and it already ran on the PR. This caller
  # reports the same check name (`scan-pr / osv-scan`) with a no-op reusable job.
  scan-pr-merge-group:
    name: scan-pr
    if: github.event_name == 'merge_group'
    uses: $/.github/workflows/merge-group-noop.yml
    permissions: {}

  scan:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    permissions:
      # Required by the reusable workflow: read the code and its runs,
      # upload SARIF to code scanning.
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --recursive
        --experimental-exclude=ui
        ./
