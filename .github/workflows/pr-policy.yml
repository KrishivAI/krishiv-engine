name: PR policy

# Label-dependent repository policy (DCO, AI-attribution ban, PR size cap with the `size-approved`
# label). The budget and wheel-size gates are jobs of ci.yml (after their
# measurements, so none waits on a runner); a label change re-runs them from
# `regate` below.
# Kept out of ci.yml so that label changes re-run only these small jobs
# instead of cancelling and rebuilding the full CI run. The job name `policy`
# is a required status check; do not rename it.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Repository policy: always runs (cheap; builds xtask only).
  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: $/.github/actions/setup-mold
      - run: cargo xtask workflow-lint
      # An invalid workflow file (bad expression, unknown input, wrong `needs`) fails the PR here, not on the run.
      # install-action does not list actionlint: the release binary, pinned by version and sha256.
      - name: Install actionlint 1.7.7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -shellcheck='
      - run: cargo xtask spdx
      - run: cargo xtask source-guard
      - run: cargo xtask file-size
      - run: cargo xtask registry-coverage
      - name: Large-file guard (new files over 1 MiB need .github/large-files-allow.txt)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-large-files.sh "$BASE_SHA" "$HEAD_SHA"
      - name: DCO sign-off (ADR 0033)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask dco --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Changelog fragment (changelog.d, or the no-changelog label)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: cargo xtask changelog check --base "$BASE_SHA" --head "$HEAD_SHA" --labels "$PR_LABELS"
      - name: No AI attribution (every commit, PR title and body; owner rule)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: .github/scripts/check-ai-attribution.sh "$BASE_SHA" "$HEAD_SHA"
      # The `size-approved` label only counts when the configured approver
      # (repository variable SIZE_APPROVER, the maintainer) applied it after
      # the current head arrived (.github/scripts/approval-label.sh). The run
      # that sees it fresh records the measured size in a comment; later pushes
      # (merges of the base branch included) keep the approval while the size
      # stays within 5% of that value. A force push, removing the label or
      # growing past the margin ends it. The same holds for `budget-approved`
      # (per metric); `unsafe-reviewed` is strict: no new unsafe site.
      - name: Measure the PR size the approval is recorded against
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask pr-size-value --base "$BASE_SHA" --head "$HEAD_SHA" > "$RUNNER_TEMP/size.values"
      - name: Resolve size-approved label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'size-approved') }}
          APPROVER: ${{ vars.SIZE_APPROVER }}
          VALUES_FILE: ${{ runner.temp }}/size.values
          APPROVAL_SCOPE: size
        run: echo "SIZE_APPROVED=$(.github/scripts/approval-label.sh size-approved)" >> "$GITHUB_ENV"
      - name: PR size cap (10,000 counted lines; tests at half weight; allowlisted data files excluded)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask pr-size --base "$BASE_SHA" --head "$HEAD_SHA"

  # A label change re-runs only the label-aware gates of the CI run for this head
  # (they read the labels live). While CI is still running there is nothing to
  # re-run: the gates have not started and will read the new labels themselves.
  regate:
    if: github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Re-run the budget and wheel-size gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          read -r run status < <(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0] | [.id, .status] | @tsv')
          if [ -z "${run:-}" ]; then
            echo "No CI run for $HEAD_SHA yet; the gates will read the labels when they run."
            exit 0
          fi
          jobs=$(gh api "repos/$REPO/actions/runs/$run/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name == "gates-ready" or .name == "budgets" or .name == "wheel-sizes") | [.name, .status, .id] | @tsv')
          # The gates have not started: they will read the labels themselves.
          if ! printf '%s\n' "$jobs" | grep -qP '^(budgets|wheel-sizes)\tcompleted\t'; then
            echo "The gates have not finished; they read the labels when they run."
            exit 0
          fi
          if [ "$status" != completed ]; then
            echo "::error::The gates already ran and CI is still running, so they cannot be re-run yet. Re-run the failed jobs of CI run $run when it finishes." >&2
            exit 1
          fi
          id=$(printf '%s\n' "$jobs" | awk -F'\t' '$1 == "gates-ready" {print $3}')
          # Re-running the parent re-runs both gates with it.
          gh api -X POST "repos/$REPO/actions/jobs/$id/rerun"
