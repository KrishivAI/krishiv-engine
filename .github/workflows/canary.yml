# SPDX-License-Identifier: Apache-2.0
# CI canary (owner-approved 2026-11-15): the nightly run on main (nightly.yml, which calls ci.yml) executes the full
# PR check set (its `schedule` event adds the heavy jobs). This daily job checks that the latest scheduled run on main
# passed and ran recently, and alerts when it did not. Alerts go to ntfy when the repository secret
# NTFY_TOPIC is set; the job summary always says what it found.
name: canary

on:
  schedule:
    # 05:30 UTC is the cron time; GitHub has created this canary up to about eight hours late (an earlier
    # 13:00 cron ran at 20:52-22:40). The nightly cron (22:23) has been created 03:17-03:34 UTC (about five hours
    # late) and its longest job may run 350 minutes, so the latest run may still be going: then the newest
    # completed run is judged instead, and a run younger than 8 hours is not a problem for being unfinished.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  check-nightly:
    if: github.repository == 'KrishivAI/krishiv-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Latest scheduled nightly run on main
        id: run
        run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main --event schedule \
            --limit 2 --json conclusion,createdAt,url,status \
            -q '.[] | "\(.status) \(.conclusion // "none") \(.createdAt) \(.url)"') || runs="query-failed"
          run=$(echo "$runs" | sed -n 1p)
          fallback=""
          problem=""
          judged=yes
          if [ "$runs" = "query-failed" ]; then
            problem="could not query the scheduled ci runs on main (see the step log)"
          elif [ -z "$run" ]; then
            problem="no scheduled ci run on main was found"
          else
            status=$(echo "$run" | cut -d' ' -f1)
            created=$(echo "$run" | cut -d' ' -f3)
            if [ "$status" != "completed" ] && [ $(( $(date -u +%s) - $(date -u -d "$created" +%s) )) -lt $((8 * 3600)) ]; then
              # The night's run is still going: judge the newest completed run instead (its age is not
              # checked: the running one proves the schedule is alive), and never call that night green.
              fallback=$(echo "$runs" | sed -n 2p)
              echo "the latest scheduled run is still $status and younger than 8 hours; judging the previous completed run" >> "$GITHUB_STEP_SUMMARY"
              if [ -n "$fallback" ] && [ "$(echo "$fallback" | cut -d' ' -f1)" = completed ]; then run="$fallback"; else run=""; judged=no; fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Latest scheduled ci run on main: $run" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$problem" ] && [ -n "$run" ]; then
            status=$(echo "$run" | cut -d' ' -f1)
            conclusion=$(echo "$run" | cut -d' ' -f2)
            created=$(echo "$run" | cut -d' ' -f3)
            url=$(echo "$run" | cut -d' ' -f4)
            if [ "$status" != "completed" ]; then
              problem="the latest scheduled ci run is still $status after 8 hours ($url)"
            elif [ "$conclusion" != "success" ]; then
              problem="the latest scheduled ci run on main ended $conclusion ($url)"
            elif [ -z "$fallback" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
              if [ "$age" -gt $((26 * 3600)) ]; then
                problem="the latest scheduled ci run on main is older than 26 hours ($created, $url)"
              fi
            fi
          fi
          # The late-start guard of the scheduled workflows ends a run `success` with every job skipped:
          # a night on which nothing ran must not look green. The key job of each must not be skipped.
          if [ -z "$problem" ]; then
            for spec in "nightly.yml:all-features" "mutants.yml:mutants" "fuzz-weekly.yml:kernels" "connect-clients.yml:smoke"; do
              wf=${spec%%:*}; job=${spec#*:}
              id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --branch main --event schedule \
                --limit 1 --json databaseId -q '.[0].databaseId') || id=""
              if [ -z "$id" ]; then echo "could not list $wf runs (no run, or the query failed): not checked" >> "$GITHUB_STEP_SUMMARY"; continue; fi
              skipped=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
                -q "[.jobs[] | select(.name | startswith(\"$job\")) | select(.conclusion == \"skipped\")] | length") \
                || { skipped=0; echo "could not read run $id of $wf: not checked" >> "$GITHUB_STEP_SUMMARY"; }
              if [ "${skipped:-0}" -gt 0 ]; then
                problem="the latest scheduled $wf run on main skipped its $job job(s): it started outside the night window (run $id)"
              fi
            done
          fi
          echo "problem=$problem" >> "$GITHUB_OUTPUT"
          if [ -n "$problem" ]; then echo "::error::CI canary: $problem"; elif [ -n "$fallback" ] && [ "$judged" = yes ]; then echo "CI canary: the previous nightly run on main is green; tonight's run is still going and was not judged."; elif [ "$judged" = no ]; then echo "CI canary: the night's run is still going and no earlier run completed; not judged."; else echo "CI canary: nightly ci on main is green."; fi
      - name: Alert on ntfy
        if: steps.run.outputs.problem != ''
        env:
          PROBLEM: ${{ steps.run.outputs.problem }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::NTFY_TOPIC is not set; no push alert sent. Summary: $PROBLEM"
            exit 0
          fi
          curl -fsS --max-time 20 -H "Title: krishiv-engine CI canary" -H "Priority: high" \
            -d "$PROBLEM" "https://ntfy.sh/$NTFY_TOPIC"
      - name: Fail the canary run
        if: steps.run.outputs.problem != ''
        run: exit 1
