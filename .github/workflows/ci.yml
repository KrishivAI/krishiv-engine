name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  # A push to main re-runs only `test`, `clippy` and `wheels` (+ `wheels-ok`):
  # they refresh the main-branch Rust build caches that pull-request and
  # merge-queue runs restore from, and `wheels` uploads the Python coverage
  # baseline to Codecov. Every other job already ran on the exact commit in the
  # merge queue, so it is skipped on a push.
  push:
    branches: [main]
  # The merge queue runs the build, the workspace tests, clippy and the cheap
  # lints only (about 12 minutes). The long checks that the pull request already
  # ran (`miri-kernels`, `fuzz-build`, the `wheels` matrix) run on the pull
  # request, and again on main here every night, so a break that only appears
  # when several pull requests combine is caught within a day.
  schedule:
    - cron: "20 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Faster builds and links in CI: line tables only (backtraces and coverage keep
  # line numbers); mold is installed per job by rui314/setup-mold.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# P2 CI policy (P2-T145, ADR 0029 CI topology):
# - PR gates run on ubuntu-latest with DEFAULT features only (plus
#   `cargo hack --each-feature check`, check not test). `--all-features` test runs,
#   coverage, mutation, fuzz and macro benchmarks run nightly on GitHub-hosted
#   runners (nightly.yml).
# - Docs/bench/plan-only PRs skip the Rust jobs (`changes` job). `changes` and
#   `policy` (pr-policy.yml) only build the small `xtask` crate; they always run
#   so that DCO and the size cap still apply to docs PRs.
# - Label changes do not start this workflow (a relabel would cancel and rebuild
#   the whole run). Only the label-dependent jobs react to labels, in
#   pr-policy.yml: `policy` (size cap); `budgets` here (the gate for the
#   measurement made by `budgets-measure` here, compared with the main
#   measurement of main-measure.yml).
# - Never use `pull_request_target` (enforced by `cargo xtask workflow-lint`).

# Every third-party action is pinned to a full commit SHA (enforced by
# `cargo xtask workflow-lint`) with its version in a trailing comment; Renovate
# (renovate.json) updates both together.
# The toolchain comes from rust-toolchain.toml (1.99.1); the rustup default
# toolchain installed below honours it.

jobs:
  # Decides whether the Rust jobs run. Docs/bench/plan-only PRs skip them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.python.outputs.python }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            cargo xtask changes --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi
      # P2-T103: the full wheel matrix runs only when the wheels can change.
      - id: python
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python=true
          if [ "$EVENT" = "pull_request" ] && ! git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -qE '^(crates/krishiv-python/|python/|xtask/|\.github/workflows/ci\.yml$|\.github/workflows/wheels\.yml$|\.github/scripts/(wheel-test|approval-label)\.sh$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|budgets\.json$)'; then
            python=false
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "wheel targets: $python"

  # Formatting and spelling of non-Rust files; no Rust toolchain needed.
  text-lint:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: typos,taplo
      - run: typos
      - run: taplo fmt --check
      - name: markdownlint
        run: docker run --rm -v "$PWD:/workdir" davidanson/markdownlint-cli2:v0.23.3 "**/*.md"
      # Self-test: each checker must reject its fixture, or the gate is vacuous.
      - name: Checkers reject their fixtures
        run: |
          if typos .github/ci-fixtures/typo.md; then echo "typos accepted the typo fixture"; exit 1; fi
          if taplo fmt --check --config .github/ci-fixtures/taplo.toml .github/ci-fixtures/unformatted.toml; then echo "taplo accepted the unformatted fixture"; exit 1; fi
          if docker run --rm -v "$PWD/.github/ci-fixtures:/workdir" davidanson/markdownlint-cli2:v0.23.3 bad.md; then echo "markdownlint accepted the bad fixture"; exit 1; fi

  # P2-T151: Python code quality (ruff lint + format, ty) for python/, bench/ and
  # tests/scripts/. Needs no Rust toolchain and no built extension, and it is cheap, so it
  # runs on every PR instead of being gated by `changes`. Required check (a maintainer
  # adds `python-quality` to branch protection). Versions come from each uv.lock.
  python-quality:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: python/ (ruff, ty)
        working-directory: python
        run: |
          uv sync --frozen --no-install-project
          uv run --frozen --no-sync ruff check
          uv run --frozen --no-sync ruff format --check
          uv run --frozen --no-sync ty check
      - name: bench/ (ruff, ty)
        working-directory: bench
        run: |
          uv sync --frozen --no-install-project
          uv run --frozen --no-sync ruff check
          uv run --frozen --no-sync ruff format --check
          uv run --frozen --no-sync ty check
      # The generator scripts are not a package; they use the python/ tool environment
      # and their own tests/scripts/pyproject.toml configuration.
      - name: tests/scripts/ (ruff, ty)
        working-directory: tests/scripts
        run: |
          uv sync --frozen --no-install-project --project ../../python
          uv run --frozen --no-sync --project ../../python ruff check .
          uv run --frozen --no-sync --project ../../python ruff format --check .
          uv run --frozen --no-sync --project ../../python ty check .

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # telemetry-otlp is off in every default build: compile its code and tests here too, and
      # keep OpenTelemetry out of the default dependency tree (T125 section 6.5).
      - run: cargo clippy -p krishiv-session --all-targets --features telemetry-otlp --locked -- -D warnings
      - run: |
          cargo tree -e normal -p krishiv --locked > "$RUNNER_TEMP/tree.txt"
          ! grep -q opentelemetry "$RUNNER_TEMP/tree.txt"

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Debuginfo of the whole workspace test build does not fit the runner's disk next to the spill tests
    # ("No space left on device" in the bench-runner spill tests, an ld Bus error in otlp_collector; merge-queue
    # ejections 2026-11-07/08). Line tables keep panic backtraces and cost a fraction of the space.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image ships toolchains and images the build never uses; same list as the nightly jobs.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost \
            /opt/microsoft /opt/az /usr/lib/google-cloud-sdk /usr/lib/mono /usr/local/julia* /usr/local/graalvm \
            /opt/hostedtoolcache/Java_* /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy
          df -h /
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      # TPC-H SF 0.1 for the simulated two-worker cluster (krishiv-sim
      # `tpch_sim`, design P2-T176 unit 2); without it the test reads the SF
      # 0.01 fixture.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: TPC-H SF 0.1 Parquet
        run: uv run --frozen --project bench python -I tests/scripts/gen_tpch_parquet.py 0.1 "$RUNNER_TEMP/tpch-sf0.1"
      # Every GitHub-hosted x64 runner has x86-64-v3, so the kernel tests must
      # run that clone, not skip it (AVX-512 varies by runner: not required).
      - run: cargo nextest run --workspace --locked --no-tests=pass
        env:
          KRISHIV_REQUIRE_TARGETS: baseline,x86_64v3
          KRISHIV_SIM_TPCH_DIR: ${{ runner.temp }}/tpch-sf0.1
      - run: cargo test --workspace --doc --locked
      - run: cargo nextest run -p krishiv-session --features telemetry-otlp --test otlp_collector --locked
      - name: Disk left
        if: always()
        run: df -h / "$RUNNER_TEMP"

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  machete:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete
      - run: cargo machete

  hack:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack
      - run: cargo hack check --each-feature --workspace --locked

  layering:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - run: cargo xtask layering

  # The generated Spark Connect types match the vendored protos (P2-T091a).
  # `tools/connect-protogen` is a workspace of its own (protox, prost-build),
  # so the product dependency graph does not carry the protobuf compiler.
  connect-protos:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/connect-protogen
      - run: cargo run --locked --manifest-path tools/connect-protogen/Cargo.toml -- --check

  # The generated `krishiv.plan.v1` types match proto/krishiv/plan/v1 (P2-T173),
  # and every schema element added since ADR 0040 declares its compatibility class.
  # `tools/plan-protogen` is a workspace of its own, like connect-protogen.
  plan-protos:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/plan-protogen
      - run: cargo run --locked --manifest-path tools/plan-protogen/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path tools/plan-protogen/Cargo.toml

  # The cargo-fuzz targets (`fuzz/`, a workspace of its own) only run nightly,
  # so a change to an API they call would break them unseen. Build all of them
  # here; same pinned nightly as fuzz.yml. cargo-fuzz has no --locked; the
  # committed fuzz/Cargo.lock pins the graph.
  fuzz-build:
    needs: changes
    # Not in the merge queue (it ran on the pull request; the nightly run covers main).
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NIGHTLY: nightly-2026-08-12
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned nightly toolchain (cargo-fuzz needs it)
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Build every fuzz target
        working-directory: fuzz
        # cargo-fuzz builds for its own compile-time target unless told
        # otherwise, and the prebuilt binary taiki-e installs is a static musl
        # one: its default target is x86_64-unknown-linux-musl, where the
        # sanitizer cannot link ("sanitizer is incompatible with statically
        # linked libc"). Name the runner's target.
        run: cargo "+$NIGHTLY" fuzz build --target x86_64-unknown-linux-gnu

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-version in Cargo.toml is the MSRV (1.97). Check with exactly that
      # toolchain; RUSTUP_TOOLCHAIN overrides rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - run: cargo check --workspace --all-targets --locked
        env:
          RUSTUP_TOOLCHAIN: "1.97"

  docs:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - run: cargo doc --workspace --no-deps --locked

  # P2-T147: `cargo publish --dry-run` for `krishiv` and the workspace crates it
  # depends on. Nothing is uploaded and the repository stays unpublishable: the
  # script runs on a scratch copy (see its header and RELEASING.md).
  release-dry-run:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - run: .github/scripts/publish-dry-run.sh

  # P2-T020: Miri on krishiv-kernels (ADR 0029; the crate holds unsafe and
  # SIMD dispatch). P2-T098a: also the Arrow C stream bridge of
  # krishiv-python (`src/stream/tests.rs`; the pyo3 glue cannot run under
  # Miri). The job always runs and reports, so it can be a required
  # check; the path gate is inside: it only does work when the PR touches what
  # Miri compiles: those crates, their path dependency krishiv-common, the
  # root Cargo.toml/Cargo.lock, rust-toolchain.toml or this workflow (and
  # always on the nightly run of main).
  miri-kernels:
    # Not in the merge queue (about 33 minutes; it ran on the pull request, and the nightly
    # run covers main). The check still reports there: a skipped job satisfies it.
    if: github.event_name != 'push' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Path gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            if ! git diff --name-only "$BASE_SHA...$HEAD_SHA" \
              | grep -qE '^(crates/krishiv-kernels/|crates/krishiv-python/|crates/krishiv-common/|\.github/workflows/ci\.yml$|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "miri-kernels: run=$run"
      # Dated nightly: Miri ships only on nightly; pinning keeps runs reproducible.
      - name: Nightly toolchain with Miri
        if: steps.gate.outputs.run == 'true'
        run: rustup toolchain install nightly-2026-08-12 --profile minimal --component miri,rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.gate.outputs.run == 'true'
      - name: Miri (unit, property and doc tests; reduced cases under cfg(miri))
        if: steps.gate.outputs.run == 'true'
        run: cargo +nightly-2026-08-12 miri test -p krishiv-kernels --locked
      - name: Miri (Arrow C stream bridge of krishiv-python)
        if: steps.gate.outputs.run == 'true'
        run: cargo +nightly-2026-08-12 miri test -p krishiv-python --test stream_ffi --locked
      # Wheels are dist builds (release settings, no overflow checks): hostile producer
      # headers must be rejected before arrow-rs computes with them, not by a
      # debug-build overflow panic.
      - name: Miri (Arrow C stream bridge, overflow checks off as in release)
        if: steps.gate.outputs.run == 'true'
        env:
          CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "false"
        run: cargo +nightly-2026-08-12 miri test -p krishiv-python --test stream_ffi --locked

  # Budget measurement (pull requests only). This job only measures and uploads
  # `budgets-current.json`; the label-aware gate (`budgets` below)
  # compares it with the measurement main-measure.yml made on main for the
  # commit the PR was measured against (recorded next to it as
  # `measured-base-sha`). That way adding the `budget-approved` or
  # `unsafe-reviewed` label re-runs only the cheap gate, not this build. The
  # job name and artifact name are read by .github/scripts/budgets-measurement.sh;
  # keep them in sync.
  budgets-measure:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent (the base tip), for the
          # recorded `measured-base-sha`; the default depth 1 has no parent.
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      # --build-time wipes its own target dir, so it measures a clean build.
      - run: cargo xtask budgets --build-time --measure-only
      # The checkout is the PR's merge with the base branch; its first parent
      # is the main commit this measurement is to be compared with.
      - name: Record the main commit measured against
        run: git rev-parse HEAD^1 > target/measured-base-sha
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budgets-current
          path: |
            target/budgets-current.json
            target/measured-base-sha
          if-no-files-found: error

  # P2-T148: the Python wheels build and import. abi3 (CPython >= 3.11, one
  # wheel) and the free-threaded cp314t wheel (not abi3). Branch protection
  # requires `wheels-ok` below, not the matrix legs.
  wheels:
    needs: changes
    # Not in the merge queue (it ran on the pull request): `wheels-ok` passes when it is skipped.
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    # `id-token: write` lets the coverage leg upload to Codecov via OIDC (no secret).
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: abi3-cp311
            python: "3.11"
            maturin_args: ""
            wheel_tag: cp311-abi3
            coverage: true
          - name: cp314t
            python: "3.14t"
            maturin_args: "--no-default-features --features mimalloc"
            wheel_tag: cp314t
            coverage: false
    name: wheels (${{ matrix.name }})
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # A pull request is checked out as the merge commit; two commits of
      # history give the diff gate below its first parent (the base tip).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python ${{ matrix.python }}
        env:
          PY: ${{ matrix.python }}
        run: uv python install "$PY"
      - name: maturin build
        working-directory: python
        env:
          PY: ${{ matrix.python }}
          MATURIN_ARGS: ${{ matrix.maturin_args }}
        run: |
          read -r -a extra <<< "$MATURIN_ARGS"
          uvx --from "maturin>=1.9.4,<2" maturin build --release "${extra[@]}" --interpreter "$(uv python find "$PY")" -o ../dist
      - name: Wheel has the expected tag
        env:
          TAG: ${{ matrix.wheel_tag }}
        run: |
          find dist -name '*.whl' -print
          find dist -name "*-${TAG}-*.whl" | grep -q .
      - name: Import test in a clean venv
        env:
          PY: ${{ matrix.python }}
          COVERAGE: ${{ matrix.coverage }}
        run: |
          uv venv --python "$PY" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl pytest pytest-cov
          # P2-T130: python/tests/test_stubs.py runs `mypy --strict` over the examples and
          # `mypy.stubtest` against the built extension; both skip when mypy is absent. The pin is
          # the one python/README.md shows. Required on the coverage leg; elsewhere a missing
          # wheel skips them with a notice.
          if ! uv pip install --python "$RUNNER_TEMP/venv/bin/python" "mypy==2.4.0"; then
            if [ "$COVERAGE" = "true" ]; then exit 1; fi
            echo "::notice::mypy has no install for this interpreter; the stub checks are skipped"
          fi
          # The Arrow PyCapsule consumers the bridge tests run against, from
          # binary wheels only. All are required on abi3; Polars and DuckDB
          # publish no free-threaded wheels yet, so on cp314t a missing one
          # skips its tests (with a notice) instead of failing the leg.
          # Versions come from python/ci-interop-constraints.txt (pinned).
          for dep in "pyarrow" "polars" "duckdb"; do
            if ! uv pip install --python "$RUNNER_TEMP/venv/bin/python" --only-binary :all: \
                --constraint "$GITHUB_WORKSPACE/python/ci-interop-constraints.txt" "$dep"; then
              if [ "$COVERAGE" = "true" ]; then exit 1; fi
              echo "::notice::$dep has no wheel for this interpreter; its tests are skipped"
            fi
          done
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import krishiv, sys; print(krishiv.__version__, sys.version)"
          if [ "$COVERAGE" = "true" ]; then
            # Run from the workspace root so [tool.coverage.paths] maps the installed
            # package back to python/krishiv. The pytest entry point does not put the
            # current directory on sys.path, so the installed wheel is still what is tested.
            cd "$GITHUB_WORKSPACE"
            "$RUNNER_TEMP/venv/bin/pytest" python/tests -q --cov=krishiv --cov-config=python/pyproject.toml \
              --cov-report=xml:python-coverage.xml --cov-report=lcov:python-coverage.lcov --cov-report=term
          else
            "$RUNNER_TEMP/venv/bin/pytest" "$GITHUB_WORKSPACE/python/tests" -q
          fi
      # P2-T147: the README's Quickstart, run from a clean venv against the wheel
      # just built (the commands CI runs are the ones the README shows).
      - name: Quickstart from the README (clean venv, built wheel)
        if: matrix.coverage
        env:
          PY: ${{ matrix.python }}
        run: .github/scripts/quickstart-test.sh dist "$PY"
      # Python diff coverage is a merge gate (this job is part of the required
      # `wheels-ok`): at least 90% of the executable lines a PR adds under
      # python/krishiv must run in the pytest run above, counted as coverage.py
      # defines them. It is gated on its own, not summed with the Rust gate
      # (`diff-coverage` in coverage.yml), so a well-covered Rust diff cannot
      # mask untested Python or the reverse. The merge commit is what was
      # tested, so the diff is first parent..merge commit, in its line numbers.
      - name: Python diff coverage (gate at 90% of added lines)
        if: matrix.coverage && github.event_name == 'pull_request'
        run: |
          # The lcov paths must be repository-relative, or no added line matches
          # and the gate would pass vacuously.
          grep -q '^SF:python/krishiv/' python-coverage.lcov \
            || { echo "::error::python-coverage.lcov has no python/krishiv paths"; exit 1; }
          cargo xtask diff-coverage --base HEAD^1 --head HEAD --lcov python-coverage.lcov --fail-under 90
      # Skipped on merge-queue runs: the coverage report only feeds the PR diff
      # gate above and an informational upload, both already done on the PR.
      - name: Upload Python coverage to Codecov (informational)
        if: matrix.coverage && github.event_name != 'merge_group'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: python-coverage.xml
          flags: python
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  # P2-T103: every wheel target (wheels.yml), on PRs that can change them.
  # Not on a push to main (main-measure.yml builds and measures the wheels there)
  # nor in the merge queue (it rebuilds them after the push); `wheels-ok` passes.
  wheels-targets:
    needs: changes
    if: needs.changes.outputs.python == 'true' && github.event_name != 'push' && github.event_name != 'merge_group'
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/wheels.yml

  # Required-check summary for the `wheels` matrix: a skipped matrix job reports
  # under an unexpanded name, so the legs themselves cannot be required. This job
  # always reports and passes when the wheels passed or were skipped (no Rust change).
  # It covers building, testing and measuring the wheels; their size is gated by
  # the `wheel-sizes` job below (label-aware), which is required too.
  wheels-ok:
    needs: [changes, wheels, wheels-targets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check the wheel builds
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.wheels.result }}
          TARGETS: ${{ needs.wheels-targets.result }}
        run: |
          echo "changes: $CHANGES, wheels: $RESULT, wheel targets: $TARGETS"
          # A skip only counts when `changes` itself succeeded.
          [ "$CHANGES" = success ] || exit 1
          for r in "$RESULT" "$TARGETS"; do
            case "$r" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  # Budget and wheel-size gates are in this workflow, after the jobs they judge
  # (`needs`), so no job holds a runner while it waits for a measurement. Adding or
  # removing a label re-runs just these two jobs (pr-policy.yml, `regate`), which
  # read the labels live. Both are required checks; skipped in the merge queue.
  # Budget gate (pull requests only): compares the measurement made by ci.yml's
  # `budgets-measure` job for this head with the measurement main-measure.yml
  # made on main for the commit that measurement was built on top of (the
  # first parent of the merge commit, recorded as `measured-base-sha`; see
  # .github/scripts/main-baseline.sh), so a PR is charged only for its own
  # diff. The committed budgets.json at the base commit is used only while main
  # has recorded no measurement at all; afterwards a missing one fails the job
  # with the reason. The PR's own budgets.json is never read: a PR must not
  # raise its own baseline.
  # The gate's scripts and xtask are those of the base commit, not the PR's
  # (checkout of the base sha), so a PR cannot edit the rules it is judged by;
  # a change to the gate takes effect once it has merged.
  # Growth beyond the budget needs `budget-approved`, new unsafe sites need
  # `unsafe-reviewed` (same approval rule as `size-approved`). Adding a label
  # re-runs only this job; it waits for the measurement while CI is still
  # running. Nothing needs recording after a merge: main's next measurement
  # is the next baseline.
  # Starts the two gates below once every measurement has finished, and is the one
  # job `regate` (pr-policy.yml) re-runs after a label change: re-running it
  # re-runs both gates with it. It does nothing itself.
  gates-ready:
    needs: [changes, budgets-measure, wheels-targets, wheels-ok]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - run: echo "Measurements finished; the budget and wheel-size gates follow."

  budgets:
    # Starts when the measurement has finished (never before), so no runner polls for it.
    needs: [changes, gates-ready]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # The gate itself (these scripts and xtask) comes from the base commit,
      # not from the pull request, so a PR cannot edit the rules it is judged
      # by. Only the measurement files come from the PR's CI run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      # A base that predates the main-measurement design has neither the
      # selection script nor `--baseline`: it is judged entirely by its own
      # (old) gate, still without running any pull request code.
      - name: Choose the gate
        id: gate
        run: |
          if [ -f .github/scripts/main-baseline.sh ] && grep -qF '"--baseline"' xtask/src/budgets.rs; then
            echo "mode=main" >> "$GITHUB_OUTPUT"
          else
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            echo "The base commit predates the main-measurement gate; compared with its committed budgets.json as before." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The label is read now, from the API: a re-run of this job after a label
      # change must not see the stale event payload.
      - name: Read the labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for l in budget-approved unsafe-reviewed; do
            v=$(gh api "repos/$REPO/issues/$PR/labels" --jq "any(.[]; .name == \"$l\")")
            echo "${l//-/_}=$v" >> "$GITHUB_OUTPUT"
          done
      - name: Find the CI measurement
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUT_DIR: ${{ runner.temp }}/budgets
          NO_WAIT: "1"
        # Assign first: a failing command substitution inside `echo` would not
        # fail the step.
        run: |
          result=$(.github/scripts/budgets-measurement.sh)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = pending ]; then
            echo "::error::the measurement is not available (the job it needs was cancelled or its run is gone); re-run CI" >&2
            exit 1
          fi
      - name: Select the main baseline
        id: baseline
        if: steps.measure.outputs.result == 'measured' && steps.gate.outputs.mode == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA_FILE: ${{ runner.temp }}/budgets/measured-base-sha
          ARTIFACT: budgets-main
          FILE: budgets-current.json
          OUT_DIR: ${{ runner.temp }}/budgets-main
          WAIT_SECS: 600
        run: |
          source=$(.github/scripts/main-baseline.sh)
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.measure.outputs.result == 'measured'
        with:
          toolchain: 1.99.1
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        if: steps.measure.outputs.result == 'measured'
      - name: Values the budget approvals are recorded against
        if: steps.measure.outputs.result == 'measured'
        # A base that predates the script has no recorded values: the label then counts only
        # when applied after the head arrived, as before.
        run: |
          if [ -x .github/scripts/approval-values.sh ]; then
            .github/scripts/approval-values.sh budgets "$RUNNER_TEMP/budgets/budgets-current.json" > "$RUNNER_TEMP/budgets.values"
          else
            : > "$RUNNER_TEMP/budgets.values"
          fi
      - name: Resolve budget-approved label
        if: steps.measure.outputs.result == 'measured'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ steps.labels.outputs.budget_approved }}
          APPROVER: ${{ vars.SIZE_APPROVER }}
          VALUES_FILE: ${{ runner.temp }}/budgets.values
          APPROVAL_SCOPE: budgets
          METRIC_FILTER: ^(transitive_crates|binary_bytes)$
        run: echo "BUDGET_APPROVED=$(.github/scripts/approval-label.sh budget-approved)" >> "$GITHUB_ENV"
      # New unsafe stays strict: any growth in any crate's count ends the approval.
      - name: Resolve unsafe-reviewed label
        if: steps.measure.outputs.result == 'measured'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ steps.labels.outputs.unsafe_reviewed }}
          APPROVER: ${{ vars.SIZE_APPROVER }}
          VALUES_FILE: ${{ runner.temp }}/budgets.values
          APPROVAL_SCOPE: unsafe
          METRIC_FILTER: '^unsafe:'
          STRICT: "true"
        run: echo "UNSAFE_APPROVED=$(.github/scripts/approval-label.sh unsafe-reviewed)" >> "$GITHUB_ENV"
      - name: Compare with the budgets
        if: steps.measure.outputs.result == 'measured'
        env:
          MEASURED: ${{ runner.temp }}/budgets/budgets-current.json
          BASELINE: ${{ runner.temp }}/budgets-main/baseline.json
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          if [ "$MODE" = main ]; then
            cargo xtask budgets --compare "$MEASURED" --baseline "$BASELINE"
          else
            cargo xtask budgets --compare "$MEASURED"
          fi
      - name: Nothing measured
        if: steps.measure.outputs.result == 'skipped'
        run: echo "No Rust change in this PR; budgets-measure was skipped." >> "$GITHUB_STEP_SUMMARY"

  # Wheel-size gate (pull requests only): compares the sizes measured by the
  # `sizes` job of wheels.yml (called by ci.yml as `wheels-targets`) for this
  # head with the sizes that job measured on main (main-measure.yml,
  # `wheel-sizes-main`) for the commit the PR's measurement was built on,
  # chosen as for `budgets` above. Growth past the budget, or a wheel without a
  # recorded size, needs `budget-approved` (same approval rule as
  # `size-approved`). The PR's own budgets.json is never read, and the gate
  # code comes from the base commit as in `budgets`. Adding a label re-runs
  # only this job. This replaces the gate that used to run inside wheels.yml,
  # which read the label from the stale event payload of the CI run.
  wheel-sizes:
    # Starts when the measurement has finished (never before), so no runner polls for it.
    needs: [changes, gates-ready]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # The gate itself (these scripts and xtask) comes from the base commit,
      # not from the pull request, so a PR cannot edit the rules it is judged
      # by. Only the measurement files come from the PR's CI run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      # A base that predates the main-measurement design has neither the
      # selection script nor `--baseline`: it is judged entirely by its own
      # (old) gate, still without running any pull request code.
      - name: Choose the gate
        id: gate
        run: |
          if [ -f .github/scripts/main-baseline.sh ] && grep -qF '"--baseline"' xtask/src/budgets.rs; then
            echo "mode=main" >> "$GITHUB_OUTPUT"
          else
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            echo "The base commit predates the main-measurement gate; compared with its committed budgets.json as before." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The label is read now, from the API: a re-run of this job after a label
      # change must not see the stale event payload.
      - name: Read the labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for l in budget-approved unsafe-reviewed; do
            v=$(gh api "repos/$REPO/issues/$PR/labels" --jq "any(.[]; .name == \"$l\")")
            echo "${l//-/_}=$v" >> "$GITHUB_OUTPUT"
          done
      - name: Find the wheel measurement
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUT_DIR: ${{ runner.temp }}/wheel-sizes
          JOB: wheels-targets / sizes
          ARTIFACT: wheel-sizes
          SKIP_JOB: wheels-targets
          NO_WAIT: "1"
        run: |
          result=$(.github/scripts/budgets-measurement.sh)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = pending ]; then
            echo "::error::the measurement is not available (the job it needs was cancelled or its run is gone); re-run CI" >&2
            exit 1
          fi
      - name: Select the main baseline
        id: baseline
        if: steps.measure.outputs.result == 'measured' && steps.gate.outputs.mode == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA_FILE: ${{ runner.temp }}/wheel-sizes/measured-base-sha
          ARTIFACT: wheel-sizes-main
          FILE: wheel-sizes.json
          OUT_DIR: ${{ runner.temp }}/wheel-sizes-main
          WAIT_SECS: 600
        run: |
          source=$(.github/scripts/main-baseline.sh)
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.measure.outputs.result == 'measured'
        with:
          toolchain: 1.99.1
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        if: steps.measure.outputs.result == 'measured'
      - name: Values the wheel-size approval is recorded against
        if: steps.measure.outputs.result == 'measured'
        # A base that predates the script has no recorded values: the label then counts only
        # when applied after the head arrived, as before.
        run: |
          if [ -x .github/scripts/approval-values.sh ]; then
            .github/scripts/approval-values.sh wheels "$RUNNER_TEMP/wheel-sizes/wheel-sizes.json" > "$RUNNER_TEMP/wheels.values"
          else
            : > "$RUNNER_TEMP/wheels.values"
          fi
      - name: Resolve budget-approved label
        if: steps.measure.outputs.result == 'measured'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ steps.labels.outputs.budget_approved }}
          APPROVER: ${{ vars.SIZE_APPROVER }}
          VALUES_FILE: ${{ runner.temp }}/wheels.values
          APPROVAL_SCOPE: wheels
          METRIC_FILTER: '^wheel:'
        run: echo "BUDGET_APPROVED=$(.github/scripts/approval-label.sh budget-approved)" >> "$GITHUB_ENV"
      - name: Compare with the budgets
        if: steps.measure.outputs.result == 'measured'
        env:
          SOURCE: ${{ steps.baseline.outputs.source }}
          MODE: ${{ steps.gate.outputs.mode }}
        # The main measurement is a plain size map; the committed fallback is
        # a budgets.json. A legacy base reads its own committed budgets.json.
        run: |
          if [ "$MODE" = legacy ]; then
            cargo xtask wheel-sizes --compare "$RUNNER_TEMP/wheel-sizes/wheel-sizes.json" --budgets budgets.json
            exit
          fi
          if [ "$SOURCE" = main ]; then flag=--baseline; else flag=--budgets; fi
          cargo xtask wheel-sizes --compare "$RUNNER_TEMP/wheel-sizes/wheel-sizes.json" \
            "$flag" "$RUNNER_TEMP/wheel-sizes-main/baseline.json"
      - name: Nothing measured
        if: steps.measure.outputs.result == 'skipped'
        run: echo "No Python or packaging change in this PR; the wheels were not built." >> "$GITHUB_STEP_SUMMARY"

  # The nightly run is the only place Miri, the fuzz-target build and the wheel matrix see combined
  # main, so a failure must not go unnoticed: open (or update) one issue, `nightly CI failed`.
  nightly-failure-notice:
    needs:
      - changes
      - text-lint
      - python-quality
      - fmt
      - clippy
      - test
      - deny
      - machete
      - hack
      - layering
      - connect-protos
      - plan-protos
      - fuzz-build
      - msrv
      - docs
      - release-dry-run
      - miri-kernels
      - wheels
      - wheels-targets
      - wheels-ok
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="nightly CI failed"
          body="The scheduled CI run on main failed at ${SHA}: ${RUN_URL}"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
