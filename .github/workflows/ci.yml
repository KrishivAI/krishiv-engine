name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Faster builds and links in CI: line tables only (backtraces and coverage keep
  # line numbers); mold is installed per job by rui314/setup-mold.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# P2 CI policy (P2-T145, ADR 0029 CI topology):
# - PR gates run on ubuntu-latest with DEFAULT features only (plus
#   `cargo hack --each-feature check`, check not test). `--all-features` test runs,
#   coverage, mutation, fuzz and macro benchmarks run nightly on GitHub-hosted
#   runners (nightly.yml).
# - Docs/bench/plan-only PRs skip the Rust jobs (`changes` job). `changes` and
#   `policy` only build the small `xtask` crate; they always run so that DCO
#   and the size cap still apply to docs PRs.
# - Never use `pull_request_target` (enforced by `cargo xtask workflow-lint`).

# NOTE: actions are pinned to major version tags for now; pin to full commit
# SHAs (Renovate can maintain them) before the repository goes public.
# The toolchain comes from rust-toolchain.toml (1.99.1); the rustup default
# toolchain installed below honours it.

jobs:
  # Decides whether the Rust jobs run. Docs/bench/plan-only PRs skip them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            cargo xtask changes --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi

  # Repository policy: always runs (cheap; builds xtask only).
  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - run: cargo xtask workflow-lint
      - run: cargo xtask spdx
      - run: cargo xtask source-guard
      - run: cargo xtask registry-coverage
      - name: DCO sign-off (ADR 0033)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask dco --base "$BASE_SHA" --head "$HEAD_SHA"
      # The `size-approved` label only counts when the configured approver
      # (repository variable SIZE_APPROVER, the maintainer) applied it after
      # the current head arrived (.github/scripts/approval-label.sh).
      - name: Resolve size-approved label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'size-approved') }}
          APPROVER: ${{ vars.SIZE_APPROVER }}
        run: echo "SIZE_APPROVED=$(.github/scripts/approval-label.sh size-approved)" >> "$GITHUB_ENV"
      - name: PR size cap (3,000 counted lines; allowlisted data files excluded)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask pr-size --base "$BASE_SHA" --head "$HEAD_SHA"

  # Formatting and spelling of non-Rust files; no Rust toolchain needed.
  text-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: typos,taplo
      - run: typos
      - run: taplo fmt --check
      - name: markdownlint
        run: docker run --rm -v "$PWD:/workdir" davidanson/markdownlint-cli2:v0.23.3 "**/*.md"
      # Self-test: each checker must reject its fixture, or the gate is vacuous.
      - name: Checkers reject their fixtures
        run: |
          if typos .github/ci-fixtures/typo.md; then echo "typos accepted the typo fixture"; exit 1; fi
          if taplo fmt --check --config .github/ci-fixtures/taplo.toml .github/ci-fixtures/unformatted.toml; then echo "taplo accepted the unformatted fixture"; exit 1; fi
          if docker run --rm -v "$PWD/.github/ci-fixtures:/workdir" davidanson/markdownlint-cli2:v0.23.3 bad.md; then echo "markdownlint accepted the bad fixture"; exit 1; fi

  # P2-T151: Python code quality (ruff lint + format, ty) for python/, bench/ and
  # tests/scripts/. Needs no Rust toolchain and no built extension, and it is cheap, so it
  # runs on every PR instead of being gated by `changes`. Required check (a maintainer
  # adds `python-quality` to branch protection). Versions come from each uv.lock.
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: python/ (ruff, ty)
        working-directory: python
        run: |
          uv sync --frozen --no-install-project
          uv run --frozen --no-sync ruff check
          uv run --frozen --no-sync ruff format --check
          uv run --frozen --no-sync ty check
      - name: bench/ (ruff, ty)
        working-directory: bench
        run: |
          uv sync --frozen --no-install-project
          uv run --frozen --no-sync ruff check
          uv run --frozen --no-sync ruff format --check
          uv run --frozen --no-sync ty check
      # The generator scripts are not a package; they use the python/ tool environment
      # and their own tests/scripts/pyproject.toml configuration.
      - name: tests/scripts/ (ruff, ty)
        working-directory: tests/scripts
        run: |
          uv sync --frozen --no-install-project --project ../../python
          uv run --frozen --no-sync --project ../../python ruff check .
          uv run --frozen --no-sync --project ../../python ruff format --check .
          uv run --frozen --no-sync --project ../../python ty check .

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      # Every GitHub-hosted x64 runner has x86-64-v3, so the kernel tests must
      # run that clone, not skip it (AVX-512 varies by runner: not required).
      - run: cargo nextest run --workspace --locked --no-tests=pass
        env:
          KRISHIV_REQUIRE_TARGETS: baseline,x86_64v3
      - run: cargo test --workspace --doc --locked

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  machete:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete
      - run: cargo machete

  hack:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack
      - run: cargo hack check --each-feature --workspace --locked

  layering:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - run: cargo xtask layering

  # The generated Spark Connect types match the vendored protos (P2-T091a).
  # `tools/connect-protogen` is a workspace of its own (protox, prost-build),
  # so the product dependency graph does not carry the protobuf compiler.
  connect-protos:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/connect-protogen
      - run: cargo run --locked --manifest-path tools/connect-protogen/Cargo.toml -- --check

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-version in Cargo.toml is the MSRV (1.97). Check with exactly that
      # toolchain; RUSTUP_TOOLCHAIN overrides rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - run: cargo check --workspace --all-targets --locked
        env:
          RUSTUP_TOOLCHAIN: "1.97"

  docs:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - run: cargo doc --workspace --no-deps --locked

  # P2-T020: Miri on krishiv-kernels (ADR 0029; the crate holds unsafe and
  # SIMD dispatch). The job always runs and reports, so it can be a required
  # check; the path gate is inside: it only does work when the PR touches what
  # Miri compiles: the kernels crate, its path dependency krishiv-common, the
  # root Cargo.toml/Cargo.lock, rust-toolchain.toml or this workflow (and
  # always on main).
  miri-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Path gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            if ! git diff --name-only "$BASE_SHA...$HEAD_SHA" \
              | grep -qE '^(crates/krishiv-kernels/|crates/krishiv-common/|\.github/workflows/ci\.yml$|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "miri-kernels: run=$run"
      # Dated nightly: Miri ships only on nightly; pinning keeps runs reproducible.
      - name: Nightly toolchain with Miri
        if: steps.gate.outputs.run == 'true'
        run: rustup toolchain install nightly-2026-08-12 --profile minimal --component miri,rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.gate.outputs.run == 'true'
      - name: Miri (unit, property and doc tests; reduced cases under cfg(miri))
        if: steps.gate.outputs.run == 'true'
        run: cargo +nightly-2026-08-12 miri test -p krishiv-kernels --locked

  # Pull requests only: measured against the base branch's budgets.json, so
  # growth always needs the label, even when the PR refreshes the baseline.
  # The baseline is updated by the PR that changes it, so main never needs to
  # re-run this. If a PR exceeds the budget,
  # a maintainer adds the `budget-approved` label (re-runs on `labeled`); the
  # job then passes and the PR author must refresh the baseline with
  #   cargo xtask budgets --write-baseline
  # and commit budgets.json (see the job summary).
  budgets:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      # Compare with the base branch's baseline, not the PR's: a PR that
      # refreshes budgets.json must not approve its own growth.
      - name: Use the base branch baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:budgets.json > budgets.json
      # --build-time wipes its own target dir, so it measures a clean build.
      # The summary table is appended to the job summary by xtask itself.
      # Same rule as `size-approved`.
      - name: Resolve budget-approved label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'budget-approved') }}
          APPROVER: ${{ vars.SIZE_APPROVER }}
        run: echo "BUDGET_APPROVED=$(.github/scripts/approval-label.sh budget-approved)" >> "$GITHUB_ENV"
      # New unsafe sites need their own review label (same approval rule).
      - name: Resolve unsafe-reviewed label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'unsafe-reviewed') }}
          APPROVER: ${{ vars.SIZE_APPROVER }}
        run: echo "UNSAFE_APPROVED=$(.github/scripts/approval-label.sh unsafe-reviewed)" >> "$GITHUB_ENV"
      - run: cargo xtask budgets --build-time
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: budgets-current
          path: target/budgets-current.json
          if-no-files-found: ignore

  # P2-T148: the Python wheels build and import. abi3 (CPython >= 3.11, one
  # wheel) and the free-threaded cp314t wheel (not abi3). Branch protection
  # requires `wheels-ok` below, not the matrix legs.
  wheels:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # `id-token: write` lets the coverage leg upload to Codecov via OIDC (no secret).
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: abi3-cp311
            python: "3.11"
            maturin_args: ""
            wheel_tag: cp311-abi3
            coverage: true
          - name: cp314t
            python: "3.14t"
            maturin_args: "--no-default-features --features mimalloc"
            wheel_tag: cp314t
            coverage: false
    name: wheels (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python ${{ matrix.python }}
        run: uv python install "${{ matrix.python }}"
      - name: maturin build
        working-directory: python
        env:
          PY: ${{ matrix.python }}
          MATURIN_ARGS: ${{ matrix.maturin_args }}
        run: |
          read -r -a extra <<< "$MATURIN_ARGS"
          uvx --from "maturin>=1.9.4,<2" maturin build --release "${extra[@]}" --interpreter "$(uv python find "$PY")" -o ../dist
      - name: Wheel has the expected tag
        env:
          TAG: ${{ matrix.wheel_tag }}
        run: |
          find dist -name '*.whl' -print
          find dist -name "*-${TAG}-*.whl" | grep -q .
      - name: Import test in a clean venv
        env:
          PY: ${{ matrix.python }}
          COVERAGE: ${{ matrix.coverage }}
        run: |
          uv venv --python "$PY" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl pytest pytest-cov
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import krishiv, sys; print(krishiv.__version__, sys.version)"
          if [ "$COVERAGE" = "true" ]; then
            # Run from the workspace root so [tool.coverage.paths] maps the installed
            # package back to python/krishiv. The pytest entry point does not put the
            # current directory on sys.path, so the installed wheel is still what is tested.
            cd "$GITHUB_WORKSPACE"
            "$RUNNER_TEMP/venv/bin/pytest" python/tests -q --cov=krishiv --cov-config=python/pyproject.toml \
              --cov-report=xml:python-coverage.xml --cov-report=term
          else
            "$RUNNER_TEMP/venv/bin/pytest" "$GITHUB_WORKSPACE/python/tests" -q
          fi
      - name: Upload Python coverage to Codecov (informational)
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: python-coverage.xml
          flags: python
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  # Required-check summary for the `wheels` matrix: a skipped matrix job reports
  # under an unexpanded name, so the legs themselves cannot be required. This job
  # always reports and passes when the wheels passed or were skipped (no Rust change).
  wheels-ok:
    needs: [changes, wheels]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the wheel builds
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.wheels.result }}
        run: |
          echo "changes: $CHANGES, wheels: $RESULT"
          # A skip only counts when `changes` itself succeeded.
          [ "$CHANGES" = success ] || exit 1
          case "$RESULT" in
            success | skipped) ;;
            *) exit 1 ;;
          esac
