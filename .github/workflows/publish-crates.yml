name: Publish to crates.io

# 0.2 release (owner 2026-11-11). MANUAL ONLY: runs when the maintainer dispatches it, never on
# push, merge, tag or schedule (xtask/tests/policy.rs keeps it that way). Run it after the PyPI
# release (RELEASING.md). Publishing is a hard stop that needs the owner's explicit go.
#
# Gates: the `crates-io` environment (required reviewers; main and `v*` tags only) and the ref
# check below. The token is the `crates-io` environment secret CARGO_REGISTRY_TOKEN (crates.io has
# no trusted publishing for this repository); only the `publish` job sees it.
#
# The crates go out in the order of .github/scripts/publish-crates.txt (dependencies first), the
# list publish-dry-run.sh checks. A crate whose version is already on crates.io is skipped, so a
# failed run can be dispatched again and resumes where it stopped.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  nightly-green:
    if: github.repository == 'KrishivAI/krishiv-engine' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Latest scheduled CI run is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-green-nightly.sh

  publish:
    needs: nightly-green
    if: github.repository == 'KrishivAI/krishiv-engine' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: crates-io
      url: https://crates.io/crates/krishiv
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check the crate list and package every crate (no upload)
        run: .github/scripts/publish-dry-run.sh --package-only
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: | # zizmor: ignore[use-trusted-publishing] scoped token in the gated crates-io environment
          version=$(cargo metadata --no-deps --format-version 1 | python3 -I -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "krishiv"))')
          while read -r crate; do
            [ -n "$crate" ] || continue
            if curl -fsS -A "krishiv-release (github.com/KrishivAI/krishiv-engine)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null 2>&1; then
              echo "$crate $version is already on crates.io: skipped"
              continue
            fi
            echo "::group::$crate $version"
            # crates.io limits how fast new crate names are created (429 "try again after <date>"): wait and retry.
            for attempt in $(seq 1 40); do
              log="$RUNNER_TEMP/publish-$crate.log"
              if cargo publish -p "$crate" --locked >"$log" 2>&1; then cat "$log"; break; fi # zizmor: ignore[use-trusted-publishing] scoped token in the gated crates-io environment
              cat "$log"
              grep -q '429 Too Many Requests' "$log" || exit 1
              [ "$attempt" -lt 40 ] || exit 1
              after=$(grep -oE 'try again after [^.]+GMT' "$log" | head -1 | sed 's/try again after //')
              wait=$(( $( date -d "$after" +%s 2>/dev/null || echo $(( $(date +%s) + 600 )) ) - $(date +%s) + 20 ))
              [ "$wait" -gt 20 ] || wait=60
              echo "rate limited on $crate (attempt $attempt): waiting ${wait}s until $after"
              sleep "$wait"
            done
            echo "::endgroup::"
          done < .github/scripts/publish-crates.txt
