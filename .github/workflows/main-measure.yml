name: Main measurement

# The baseline for the budget and wheel-size gates of pull requests
# (pr-policy.yml): every night on main, measure the budgets (`budgets-main`)
# and the wheel sizes (`wheel-sizes-main`, from the `sizes` job of wheels.yml)
# and keep them 90 days. A pull request is compared with the measurement for
# the main commit it was built on (.github/scripts/main-baseline.sh), so it is
# gated only on the growth it adds. Each run also reports its drift against
# the previous main measurement in the job summary (never failing the run), so
# growth merged under `budget-approved` stays visible.
#
# Why a workflow of its own: the runs are keyed by commit and never cancelled. ci.yml cancels superseded runs on a branch and
# would run its whole test suite for each of them; here only the two
# measurements run. ci.yml has no push trigger, so main's wheels are built only here. The workflow name in main-baseline.sh (`main-measure.yml`),
# the artifact names and the job `budgets` are read by pr-policy.yml; keep them
# in sync.

on:
  # Once a night, 00:00 CET (23:00 UTC; 01:00 during CEST), inside the 00:00-06:00 CET window, and on demand. A push to main no
  # longer starts it: each measurement builds the workspace clean and the wheels on three platforms, and the runners are
  # better spent on pull requests. A pull request is compared with the newest measurement at or before the main commit it
  # was built on (main-baseline.sh), so between two nights it is charged also for the growth of what merged in between.
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
  # Re-saves the `test` cache when it was evicted (GitHub drops caches unused for 7 days) and no push came.
  # Only the `test` job runs on a schedule; the measurements below are per pushed commit.
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

concurrency:
  group: main-measure-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Warms the Rust cache of ci.yml's `test` job. A merge-queue run (ref gh-readonly-queue/...) can restore only
  # its own ref's cache and the default branch's; ci.yml has no push trigger, so main never saved one and every
  # queue run built every dependency cold ("No cache found", 73-108 min against 21 min warm). The job id must be
  # `test` and the env the same as ci.yml's (both are part of the cache key). Libraries and bins only: that builds
  # every dependency (shared with the integration tests) without the ~560 test executables.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/free-disk
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: $/.github/actions/setup-mold
      - uses: $/.github/actions/install-tool
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --lib --bins --no-run --locked

  budgets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: $/.github/actions/setup-mold
      # --build-time wipes its own target dir, so it measures a clean build.
      - run: cargo xtask budgets --build-time --measure-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budgets-main
          path: target/budgets-current.json
          retention-days: 90
          if-no-files-found: error
      # Report only: the drift against the previous main commit's measurement.
      - name: Select the previous main measurement
        id: baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          ARTIFACT: budgets-main
          FILE: budgets-current.json
          OUT_DIR: ${{ runner.temp }}/budgets-main
          WAIT_SECS: 600
        run: |
          TARGET_SHA=$(git rev-parse HEAD^1)
          export TARGET_SHA
          source=$(.github/scripts/main-baseline.sh)
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Report the drift
        if: steps.baseline.outcome == 'success'
        env:
          BASELINE: ${{ runner.temp }}/budgets-main/baseline.json
        run: cargo xtask budgets --compare target/budgets-current.json --baseline "$BASELINE" || echo "::warning::a budget grew past 5% on main (report only; see the summary)"

  wheels:
    if: github.event_name == 'push'
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/wheels.yml
