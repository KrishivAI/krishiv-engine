name: Coverage

# Diff coverage is a merge gate: at least 90% of the executable lines a PR
# adds must run under the test suite (`diff-coverage` is a required check).
# The workflow runs on every PR so the required check always reports; when a
# PR changes nothing Rust-relevant it passes without building. Codecov upload
# stays informational (codecov.yml). The full line+branch run is the nightly
# `coverage` job in nightly.yml.
#
# The Rust run tests only the packages the PR touches plus the packages that
# depend on them (`cargo xtask coverage-scope`, from the changed paths and the
# dependency graph of `cargo metadata`): the added lines live in the touched
# packages, and their dependents' tests cover them too. Paths outside every
# package (manifests, the lock file, protos, shared test data) add no executable
# line, so they select nothing. A change to this workflow selects the whole
# workspace, and a PR that changes only docs, CI, agent config or bench skips
# the Rust run and passes.
#
# Python is gated by the same rule, counting executable lines as coverage.py
# defines them: bench/src here (its pytest run is pure Python), python/krishiv
# in the `wheels` job of ci.yml (it needs the built extension and reuses that
# job's pytest run). Each language is gated at 90% on its own rather than as
# one sum, so a large well-covered diff in one cannot hide untested lines in
# the other; that is no weaker than the Rust-only gate it extends.
on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Faster builds and links in CI: line tables only (backtraces and coverage keep
  # line numbers); mold is installed per job by .github/actions/setup-mold.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  diff-coverage:
    # Pull requests only: the diff gate was enforced on the PR; a merge-group
    # run reports this job as skipped, which satisfies the required check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `id-token: write` lets same-repo PRs upload to Codecov via OIDC (no
    # secret). Fork PRs get no OIDC token and use Codecov's tokenless upload.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Check out the PR head, not the merge commit: the diff's line numbers
      # (base...head) must match the tree that produces the LCOV report.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Same Rust-relevance rule as CI's `changes` job, without building xtask.
      - name: Rust-relevant changes?
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rust=false
          bench=false
          while IFS= read -r p; do
            case "$p" in
              # This workflow runs the gate, so changing it is tested; other CI and
              # agent configuration compiles nothing (xtask `coverage-scope` agrees).
              .github/workflows/coverage.yml) rust=true ;;
              .github/*|.claude/*|.githooks/*) ;;
              bench/src/*|bench/tests/*|bench/pyproject.toml|bench/uv.lock) bench=true ;;
              docs/*|bench/*|.superpowers/*) ;;
              crates/*|xtask/*) rust=true ;;
              *.md) ;;
              *) rust=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "bench=$bench" >> "$GITHUB_OUTPUT"
          # xtask runs the gate, so it needs cargo for either language.
          if [ "$rust" = true ] || [ "$bench" = true ]; then echo "cargo=true" >> "$GITHUB_OUTPUT"; else echo "cargo=false" >> "$GITHUB_OUTPUT"; fi
          echo "Rust-relevant changes: $rust, bench changes: $bench"
      # The instrumented build of a wide change (many dependent packages) can fill
      # the runner's disk (2026-11-04: "No space left on device" at the link with 41 GB free after
      # the first cleanup). Drop preinstalled toolchains this job never uses.
      - name: Free runner disk
        if: steps.changes.outputs.rust == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost \
            /opt/microsoft /opt/az /usr/lib/google-cloud-sdk /usr/lib/mono /usr/local/julia* /usr/local/graalvm \
            /opt/hostedtoolcache/Java_* /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy
          df -h /
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changes.outputs.cargo == 'true'
        run: rustup show active-toolchain
      - name: llvm-tools
        if: steps.changes.outputs.rust == 'true'
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.cargo == 'true'
      - uses: $/.github/actions/setup-mold
        if: steps.changes.outputs.cargo == 'true'
      # Which packages to test: see the comment at the top of this file.
      - name: Coverage scope (touched packages and their dependents)
        id: scope
        if: steps.changes.outputs.rust == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask coverage-scope --base "$BASE_SHA" --head "$HEAD_SHA"
      # The benchmark harness tests need no built extension: plain pytest under
      # coverage.py, writing an lcov tracefile with paths relative to bench/.
      - uses: $/.github/actions/setup-uv
        if: steps.changes.outputs.bench == 'true'
      - name: bench/ tests under coverage.py
        id: benchcov
        if: steps.changes.outputs.bench == 'true'
        working-directory: bench
        run: |
          uv sync --frozen
          uv run --frozen --no-sync pytest -q --cov=src/krishiv_bench --cov-report="lcov:$RUNNER_TEMP/bench.lcov"
      - uses: $/.github/actions/install-tool
        if: steps.scope.outputs.rust == 'true'
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # The Python UDF worker interpreter of krishiv-udf-pool's tests, as in CI's `test` job: without
      # it `tests/pool.rs` passes with a note and starts no worker, so the pool's lines go uncovered.
      - uses: $/.github/actions/setup-uv
        if: steps.scope.outputs.rust == 'true'
      - name: UDF worker interpreter
        if: steps.scope.outputs.rust == 'true'
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/udf-python"
          uv pip install --python "$RUNNER_TEMP/udf-python/bin/python" \
            "pyspark-client==4.2.1" "pyarrow==26.0.1" "pandas==3.1.1" "numpy==2.5.4"
      # Line coverage on the pinned stable toolchain (branch coverage needs
      # nightly and runs in the nightly job).
      - name: Coverage run
        if: steps.scope.outputs.rust == 'true'
        env:
          PACKAGES: ${{ steps.scope.outputs.packages }}
          KRISHIV_TEST_UDF_PYTHON: ${{ runner.temp }}/udf-python/bin/python
          KRISHIV_UDF_POOL_REQUIRED: "1"
        run: |
          # `PACKAGES` is `-p a -p b`, or empty for the whole workspace; the
          # word splitting is intended.
          # shellcheck disable=SC2086
          cargo xtask coverage --no-branch $PACKAGES
          df -h /
      - name: Diff coverage (gate at 90% of added lines)
        if: steps.scope.outputs.rust == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask diff-coverage --base "$BASE_SHA" --head "$HEAD_SHA" --fail-under 90
      - name: Diff coverage, bench/ Python (gate at 90% of added lines)
        if: steps.changes.outputs.bench == 'true' && !cancelled() && steps.benchcov.outcome == 'success'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Unmapped paths match no added line, so the gate would pass vacuously.
          grep -Eq "^SF:(src/krishiv_bench/|$GITHUB_WORKSPACE/bench/src/krishiv_bench/)" "$RUNNER_TEMP/bench.lcov" \
            || { echo "::error::bench.lcov has no src/krishiv_bench paths"; exit 1; }
          cargo xtask diff-coverage --base "$BASE_SHA" --head "$HEAD_SHA" --lcov "$RUNNER_TEMP/bench.lcov:bench" --fail-under 90
      - name: Upload to Codecov (informational)
        # Only a whole-workspace run uploads: a partial run would replace the carried-forward flag.
        if: steps.scope.outputs.workspace == 'true' && !cancelled()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/lcov.info
          flags: rust,pr
          use_oidc: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false
