name: Coverage

# Diff coverage is a merge gate: at least 90% of the executable lines a PR
# adds must run under the test suite (`diff-coverage` is a required check).
# The workflow runs on every PR so the required check always reports; when a
# PR changes nothing Rust-relevant it passes without building. Codecov upload
# stays informational (codecov.yml). The full line+branch run is the nightly
# `coverage` job in nightly.yml.
#
# Python is gated by the same rule, counting executable lines as coverage.py
# defines them: bench/src here (its pytest run is pure Python), python/krishiv
# in the `wheels` job of ci.yml (it needs the built extension and reuses that
# job's pytest run). Each language is gated at 90% on its own rather than as
# one sum, so a large well-covered diff in one cannot hide untested lines in
# the other; that is no weaker than the Rust-only gate it extends.
on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Faster builds and links in CI: line tables only (backtraces and coverage keep
  # line numbers); mold is installed per job by rui314/setup-mold.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  diff-coverage:
    # Pull requests only: the diff gate was enforced on the PR; a merge-group
    # run reports this job as skipped, which satisfies the required check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `id-token: write` lets same-repo PRs upload to Codecov via OIDC (no
    # secret). Fork PRs get no OIDC token and use Codecov's tokenless upload.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Check out the PR head, not the merge commit: the diff's line numbers
      # (base...head) must match the tree that produces the LCOV report.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Same Rust-relevance rule as CI's `changes` job, without building xtask.
      - name: Rust-relevant changes?
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rust=false
          bench=false
          while IFS= read -r p; do
            case "$p" in
              .github/*|.claude/*|.githooks/*) rust=true ;;
              bench/src/*|bench/tests/*|bench/pyproject.toml|bench/uv.lock) bench=true ;;
              docs/*|bench/*|.superpowers/*) ;;
              crates/*|xtask/*) rust=true ;;
              *.md) ;;
              *) rust=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "bench=$bench" >> "$GITHUB_OUTPUT"
          # xtask runs the gate, so it needs cargo for either language.
          if [ "$rust" = true ] || [ "$bench" = true ]; then echo "cargo=true" >> "$GITHUB_OUTPUT"; else echo "cargo=false" >> "$GITHUB_OUTPUT"; fi
          echo "Rust-relevant changes: $rust, bench changes: $bench"
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changes.outputs.cargo == 'true'
        run: rustup show active-toolchain
      - name: llvm-tools
        if: steps.changes.outputs.rust == 'true'
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.cargo == 'true'
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        if: steps.changes.outputs.cargo == 'true'
      # The benchmark harness tests need no built extension: plain pytest under
      # coverage.py, writing an lcov tracefile with paths relative to bench/.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.changes.outputs.bench == 'true'
      - name: bench/ tests under coverage.py
        id: benchcov
        if: steps.changes.outputs.bench == 'true'
        working-directory: bench
        run: |
          uv sync --frozen
          uv run --frozen --no-sync pytest -q --cov=src/krishiv_bench --cov-report="lcov:$RUNNER_TEMP/bench.lcov"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: steps.changes.outputs.rust == 'true'
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # Line coverage on the pinned stable toolchain (branch coverage needs
      # nightly and runs in the nightly job).
      - if: steps.changes.outputs.rust == 'true'
        run: cargo xtask coverage --no-branch
      - name: Diff coverage (gate at 90% of added lines)
        if: steps.changes.outputs.rust == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask diff-coverage --base "$BASE_SHA" --head "$HEAD_SHA" --fail-under 90
      - name: Diff coverage, bench/ Python (gate at 90% of added lines)
        if: steps.changes.outputs.bench == 'true' && !cancelled() && steps.benchcov.outcome == 'success'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Unmapped paths match no added line, so the gate would pass vacuously.
          grep -Eq "^SF:(src/krishiv_bench/|$GITHUB_WORKSPACE/bench/src/krishiv_bench/)" "$RUNNER_TEMP/bench.lcov" \
            || { echo "::error::bench.lcov has no src/krishiv_bench paths"; exit 1; }
          cargo xtask diff-coverage --base "$BASE_SHA" --head "$HEAD_SHA" --lcov "$RUNNER_TEMP/bench.lcov:bench" --fail-under 90
      - name: Upload to Codecov (informational)
        if: steps.changes.outputs.rust == 'true' && !cancelled()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/lcov.info
          flags: rust,pr
          use_oidc: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false
