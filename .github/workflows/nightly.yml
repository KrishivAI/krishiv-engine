name: Nightly (heavy)

# Heavy jobs run on the self-hosted `krishiv-heavy` runner (ops/ci-runner.md,
# ADR 0029 CI topology), never on pull_request: untrusted code must not reach
# the runner (`cargo xtask workflow-lint` enforces both rules).
# Coverage (cargo-llvm-cov), mutation (cargo-mutants), fuzz and the macro
# benchmarks (TPC-H/TPC-DS/ClickBench) are added here by their own tasks
# (P2-T105/T107/T108/T119) as further jobs with the same runner labels.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Shared compiler cache on the runner (persists across jobs and runs).
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 20G

jobs:
  all-features:
    if: github.repository == 'KrishivAI/krishiv-engine'
    runs-on: [self-hosted, krishiv-heavy]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Shared sccache dir on the runner
        env:
          SCCACHE_DIR_VAR: ${{ vars.SCCACHE_DIR }}
        run: echo "SCCACHE_DIR=${SCCACHE_DIR_VAR:-$RUNNER_TOOL_CACHE/sccache-krishiv}" >> "$GITHUB_ENV"
      - name: Tools on PATH (runner service has a minimal PATH)
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Pinned tools (sccache, nextest)
        uses: taiki-e/install-action@v2
        with:
          tool: sccache@0.18.0,cargo-nextest@0.9.148
      - name: clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: nextest (all features)
        run: cargo nextest run --workspace --all-features --locked --no-tests=pass
      - name: doctests (all features)
        run: cargo test --workspace --doc --all-features --locked
      - name: docs (all features)
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: sccache stats
        if: always()
        run: sccache --show-stats
