name: Nightly (heavy)

# Heavy jobs run on GitHub-hosted runners (ADR 0029 CI topology); `cargo xtask
# workflow-lint` rejects any other runner kind.
# The macro benchmarks (TPC-H/TPC-DS/ClickBench) are added here by their own
# task (P2-T119) as further jobs with the same runner; `fuzz` runs every
# cargo-fuzz target of `fuzz/` (mutation testing is `mutants.yml`).
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # Faster builds and links in CI: line tables only (backtraces and coverage keep
  # line numbers); mold is installed per job by rui314/setup-mold.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Compiler cache (per job; hosted runners do not persist it).
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 20G

jobs:
  all-features:
    if: github.repository == 'KrishivAI/krishiv-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Pinned tools (sccache, nextest)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: sccache@0.18.0,cargo-nextest@0.9.148
      - name: clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: nextest (all features)
        # The row-layout aggregate's tight-memory property at full size (64
        # cases per PR).
        env:
          KRISHIV_TIGHT_MEMORY_CASES: "256"
        run: cargo nextest run --workspace --all-features --locked --no-tests=pass
      - name: doctests (all features)
        run: cargo test --workspace --doc --all-features --locked
      - name: docs (all features)
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # P2-T101 / P2-T110a: fresh differential fixtures each night, the seed being the date. Expressions
  # against a real Spark 4.2 (local mode) and generated TPC-H queries against DuckDB; a new
  # disagreement fails the job (known ones are ratcheted in tests/fixtures). Spark generation is
  # slow (about 5 minutes per 300 roots), hence the root budget; raise it with the runner time.
  differential:
    if: github.repository == 'KrishivAI/krishiv-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      RUSTC_WRAPPER: "" # sccache is not installed in this job
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Seed (the date)
        run: echo "SEED=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - name: Generate queries (DuckDB)
        run: |
          mkdir -p "$RUNNER_TEMP/diff"
          uv run --project bench python -I tests/scripts/gen_query_oracle.py \
            --data crates/krishiv-exec/tests/fixtures/tpch-sf0.01-parquet \
            --count 3000 --seed "$SEED" > "$RUNNER_TEMP/diff/queries.json"
      - name: Queries against DuckDB
        env:
          KRISHIV_QUERY_ORACLE: ${{ runner.temp }}/diff/queries.json
        run: cargo test -p krishiv-testkit --locked --test query_oracle matches_duckdb_up_to_known_failures
      - name: Generate expressions (Spark 4.2, local mode)
        run: |
          env -u SPARK_HOME uv run --no-project --python 3.12 --with 'pyspark==4.2.0' \
            python -I tests/scripts/gen_expr_differential.py --roots 1500 --seed "$SEED" \
            > "$RUNNER_TEMP/diff/expr.json"
      - name: Expressions against Spark
        run: |
          cargo run -p krishiv-testkit --locked --bin expr-diff -- \
            --fixture "$RUNNER_TEMP/diff/expr.json" \
            --known tests/fixtures/spark-4.2.0/expr-differential-known-failures.json \
            --out "$RUNNER_TEMP/diff/expr-mismatches.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: differential-${{ env.SEED }}
          path: ${{ runner.temp }}/diff
          retention-days: 30

  # P2-T105: full line + branch coverage (branch needs nightly rustc), report only.
  coverage:
    if: github.repository == 'KrishivAI/krishiv-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload (no secret)
    env:
      RUSTC_WRAPPER: "" # no sccache here: instrumented builds are not cacheable
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain with llvm-tools (branch coverage)
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo xtask coverage --all-features --html
      - name: Per-crate summary
        run: cargo xtask coverage-summary --markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            target/coverage/html
            target/coverage/summary.json
            target/coverage/lcov.info
          retention-days: 30
      - name: Upload to Codecov (informational)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/lcov.info
          flags: rust,nightly
          use_oidc: true
          fail_ci_if_error: false

  # P2-T151: Rust code reached through the Python API. The extension is built
  # under cargo-llvm-cov instrumentation, the Python tests run against it, and the
  # profile data is reported as lcov. Report only (Codecov is informational).
  python-rust-coverage:
    if: github.repository == 'KrishivAI/krishiv-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload (no secret)
    env:
      RUSTC_WRAPPER: "" # no sccache here: instrumented builds are not cacheable
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml) and llvm-tools
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Build the instrumented extension and run the Python tests
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/venv"
          # Interop versions are pinned in python/ci-interop-constraints.txt.
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "maturin>=1.9.4,<2" pytest \
            pyarrow polars duckdb \
            --constraint "$GITHUB_WORKSPACE/python/ci-interop-constraints.txt"
          # Exports RUSTFLAGS, LLVM_PROFILE_FILE and the instrumented target dir.
          # shellcheck source=/dev/null
          source <(cargo llvm-cov show-env --sh)
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/venv/bin/activate"
          (cd python && maturin develop && pytest tests -q)
          mkdir -p target/coverage
          cargo llvm-cov report --lcov --output-path target/coverage/python-lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-rust-coverage
          path: target/coverage/python-lcov.info
          retention-days: 30
      - name: Upload to Codecov (informational)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/python-lcov.info
          flags: rust-from-python
          use_oidc: true
          fail_ci_if_error: false

  # P2-T010: loom models of the memory pool accounting, spill protocol, round
  # admission and arbitration (`crates/krishiv-memory/src/loom_model.rs`);
  # P2-T050: the executor's morsel cursor, finalize countdown, cancellation
  # and result channel (`crates/krishiv-exec/src/loom_model.rs`).
  # P2-T163: runtime filter snapshot publication
  # (`crates/krishiv-io/src/runtime_filter/tests.rs`).
  # P2-T103: every wheel target, built and tested (wheels.yml).
  wheels:
    if: github.repository == 'KrishivAI/krishiv-engine'
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/wheels.yml

  loom:
    if: github.repository == 'KrishivAI/krishiv-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: "" # `--cfg loom` rebuilds every dependency; not worth caching
      RUSTFLAGS: --cfg loom
    # Each step selects only the `loom_model` modules: a loom primitive used
    # outside `loom::model` panics, so ordinary tests must never be selected
    # (xtask policy test `loom_steps_select_only_loom_models`).
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: loom models (krishiv-memory)
        run: "cargo test -p krishiv-memory --lib --release --locked loom_model::"
      - name: loom models (krishiv-exec)
        run: "cargo test -p krishiv-exec --lib --release --locked loom_model::"
      - name: loom models (krishiv-io runtime filters)
        run: "cargo test -p krishiv-io --lib --release --locked loom_model::"

  # cargo-fuzz targets (`fuzz/`), one hour each: the reusable `fuzz.yml`
  # (regression replay, cached corpus, crash triage). The weekly long run is
  # `fuzz-weekly.yml`.
  fuzz:
    if: github.repository == 'KrishivAI/krishiv-engine'
    permissions:
      contents: read
    uses: $/.github/workflows/fuzz.yml
    with:
      seconds: 3600

  # P2-T020: krishiv-kernels under AddressSanitizer with the property tests at
  # full size (Miri runs the reduced cases per PR). std is rebuilt with ASan.
  asan-kernels:
    if: github.repository == 'KrishivAI/krishiv-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: "" # sanitizer builds are not cacheable
      RUSTFLAGS: -Zsanitizer=address
      PROPTEST_CASES: "1024"
      KRISHIV_REQUIRE_TARGETS: baseline,x86_64v3
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain with rust-src
        run: rustup toolchain install nightly-2026-08-12 --profile minimal --component rust-src
      - name: Tests under ASan
        run: >-
          cargo +nightly-2026-08-12 test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p krishiv-kernels --locked --lib --tests
      # P2-T098a: the Arrow C stream bridge (import validation, export).
      - name: Arrow C stream bridge under ASan
        run: >-
          cargo +nightly-2026-08-12 test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p krishiv-python --locked --test stream_ffi

  # P2-T020: differential fuzzing of the kernels (every specialization and CPU
  # target vs the row-at-a-time reference); libFuzzer builds with ASan.
  fuzz-kernels:
    if: github.repository == 'KrishivAI/krishiv-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain
        run: rustup toolchain install nightly-2026-08-12 --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@0.13.2
      # The corpus carries over between nights: restore the latest, save anew.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/krishiv-kernels/fuzz/corpus
          key: fuzz-kernels-corpus-${{ github.run_id }}
          restore-keys: fuzz-kernels-corpus-
      # cargo-fuzz has no --locked; the committed fuzz/Cargo.lock pins the graph.
      # `--target`: the prebuilt cargo-fuzz defaults to a musl target the
      # sanitizers cannot link for (see the fuzz-build job of ci.yml).
      - name: differential (10 minutes)
        working-directory: crates/krishiv-kernels/fuzz
        run: cargo +nightly-2026-08-12 fuzz run --target x86_64-unknown-linux-gnu differential -- -max_total_time=600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-kernels-artifacts
          path: crates/krishiv-kernels/fuzz/artifacts
          retention-days: 30

  # P2-T090: the public API of the Rust facade (default features; the
  # `unstable-ir` feature is outside semver, ADR 0027) must match the
  # checked-in snapshots; a change updates them in the same PR.
  public-api:
    if: github.repository == 'KrishivAI/krishiv-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustdoc JSON ships only on nightly; pinning keeps runs reproducible.
      - name: Nightly toolchain
        run: rustup toolchain install nightly-2026-08-12 --profile minimal
      - name: Pinned tools (sccache, cargo-public-api)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: sccache@0.18.0,cargo-public-api@0.52.0
      - name: Diff against the snapshots
        run: |
          for crate in krishiv krishiv-session; do
            cargo +nightly-2026-08-12 public-api -ss -p "$crate" \
              > "$RUNNER_TEMP/$crate.txt"
            diff -u "crates/$crate/public-api.txt" "$RUNNER_TEMP/$crate.txt"
          done
