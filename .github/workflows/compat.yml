name: Compatibility suites

# Manual trigger for now. Enable the nightly schedule once P2 un-ignores the SQL suites.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      # Spark golden loaders, Murmur3 hash fixtures (93 cases), batch==stream harness and
      # sqllogictest parsing. Tests that need SQL execution are #[ignore]d until P2/P4.
      - name: Run testkit conformance tests
        run: cargo nextest run -p krishiv-testkit --all-features --locked
