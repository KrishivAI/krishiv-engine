name: Compatibility suites

# Manual trigger for now. Enable the nightly schedule once P2 un-ignores the SQL suites.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * *"

# One run at a time; a second dispatch queues instead of cancelling.
concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Faster builds and links in CI: line tables only (backtraces and coverage keep
  # line numbers); mold is installed per job by .github/actions/setup-mold.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: $/.github/actions/setup-mold
      - uses: $/.github/actions/install-tool
        with:
          tool: cargo-nextest
      # Spark golden loaders, Murmur3 hash fixtures (93 cases), batch==stream harness and
      # sqllogictest parsing. Tests that need SQL execution are #[ignore]d until P2/P4.
      - name: Run testkit conformance tests
        run: cargo nextest run -p krishiv-testkit --all-features --locked
