name: Release artifacts

# INERT BY DESIGN. Builds every release artifact from one commit and attests it; it publishes nothing:
# no registry upload, no tag, no GitHub Release (RELEASING.md, ADR 0031; xtask/tests/policy.rs
# `release_publishing_is_manual_and_gated` keeps publish steps out of this file).
#
# Manual only, on main or a `v*` tag. Produces one workflow artifact, `release-bundle`, holding:
#   - the wheels (krishiv and krishiv-compat) from wheels.yml,
#   - the Linux CLI binaries from binaries.yml and a macOS arm64 binary built here,
#   - SHA256SUMS over all of them,
#   - CycloneDX SBOMs of the facade, the CLI and the Python extension,
#   - a GitHub build-provenance attestation for every file above (verify with
#     `gh attestation verify <file> --repo KrishivAI/krishiv-engine`).
# Publishing PyPI, crates.io and the GitHub Release is a later, owner-approved change that adds gated
# jobs consuming this bundle (environment `release`, OIDC trusted publishing, no tokens).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  nightly-green:
    if: github.repository == 'KrishivAI/krishiv-engine' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Latest scheduled CI run is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-green-nightly.sh

  wheels:
    needs: nightly-green
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/wheels.yml

  binaries:
    needs: nightly-green
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/binaries.yml

  bundle:
    needs: [wheels, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # sigstore signing for the attestations
      attestations: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{wheels-*,compat-wheel-*,krishiv-*,krishiv-compat-*}"
          path: bundle
          merge-multiple: true
      - uses: $/.github/actions/setup-rust
      - uses: $/.github/actions/install-tool
        with:
          tool: cargo-cyclonedx@0.5.10
      - name: SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --override-filename krishiv-sbom.cdx
          # One SBOM per shipped package (the root manifest is virtual): the facade, the CLI and the Python extension.
          cp crates/krishiv/krishiv-sbom.cdx.json bundle/krishiv-sbom.cdx.json
          cp crates/krishiv-cli/krishiv-sbom.cdx.json bundle/krishiv-cli-sbom.cdx.json
          cp crates/krishiv-python/krishiv-sbom.cdx.json bundle/krishiv-python-sbom.cdx.json
      - name: Contents and checksums
        working-directory: bundle
        run: |
          test "$(ls *.whl | wc -l)" -ge 9
          for f in krishiv-linux-x86_64 krishiv-compat-linux-x86_64 krishiv-linux-aarch64 krishiv-macos-arm64 krishiv-sbom.cdx.json krishiv-cli-sbom.cdx.json krishiv-python-sbom.cdx.json; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
          sha256sum -- * | grep -v SHA256SUMS > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: bundle/SHA256SUMS
      - name: Verify the attestations before keeping the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: bundle
        run: |
          for f in $(ls | grep -v '^SHA256SUMS$'); do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" > /dev/null || { echo "::error::no valid attestation for $f"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: bundle/
          if-no-files-found: error
