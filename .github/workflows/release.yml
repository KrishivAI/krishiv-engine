name: Release (dry run)

# MANUAL ONLY, DRY RUN ONLY (coordinator 2026-11-07). Dispatch from the Actions tab on main or a `v*` tag. It
# builds every release artifact (wheels, Linux and macOS binaries), writes SHA-256 checksums and a CycloneDX
# SBOM, and uploads them as one workflow artifact, `release-bundle`, for the owner to inspect. It never
# uploads to a registry, tags or creates a GitHub Release: nothing here matches a publish marker in
# xtask/tests/policy.rs (`release_publishing_is_manual_and_gated` keeps that true). The crates.io dry run
# (`publish-dry-run.sh`) already runs in ci.yml. Not yet wired, needing the owner: build-provenance
# attestations, signed tags, trusted-publishing jobs behind a `release` environment (RELEASING.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run
  cancel-in-progress: false

jobs:
  nightly-green:
    if: github.repository == 'KrishivAI/krishiv-engine' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Latest scheduled CI run is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-green-nightly.sh

  wheels:
    needs: nightly-green
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/wheels.yml

  binaries:
    needs: nightly-green
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/binaries.yml

  bundle:
    needs: [wheels, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{wheels-*,compat-wheel-*,krishiv-*}"
          path: bundle
          merge-multiple: true
      - name: Checksums
        run: |
          cd bundle
          ls -l
          sha256sum -- * > SHA256SUMS
      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.7
          cargo cyclonedx --format json --override-filename krishiv.cdx
          cp krishiv.cdx.json bundle/ || cp crates/krishiv/krishiv.cdx.json bundle/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: bundle
          if-no-files-found: error
