name: Coverage probe (temporary)

# Temporary (P2-T105b): which flag of the nightly coverage run makes `llvm-cov export` crash.
# Runs only for the draft PR that adds it, which is closed unmerged.
on:
  pull_request:
    paths:
      - ".github/workflows/coverage-probe.yml"

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "--all-features --no-branch"
          - "--branch-only"
          - "--all-features"
          - "--all-features --html"
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain with llvm-tools
        run: rustup toolchain install nightly-2026-08-12 --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Coverage run
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          # "--branch-only" is the default run: branch coverage, default features.
          flags="${FLAGS/--branch-only/}"
          cargo xtask coverage ${flags}
      - name: Per-crate summary
        run: cargo xtask coverage-summary --markdown | tee -a "$GITHUB_STEP_SUMMARY"
