name: Spark Connect client smoke runs

# Report-only: the Apache Spark Connect Go and Scala clients run a shared query list against
# `krishiv server` and the job summary lists what passes. The job never fails on a client
# check (tests/connect-clients/README.md); it fails only if the server does not build or start.
on:
  workflow_dispatch:
  schedule:
    # Delay of six hours or more is expected (as for fuzz-weekly): 19:41 lands near 02:00 UTC, inside the guard's
    # night window; 23:41 would land after 06:00.
    - cron: "41 19 * * 0"

concurrency:
  group: connect-clients-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

jobs:
  # A scheduled run that GitHub delayed into the working day exits at once, so it never holds the runners
  # the PR checks need. A manual run is not guarded. Window: scheduled runs may start 18:00-06:00 UTC.
  # The window bounds the start only: a run that starts at 05:59 may still run into the morning (up to
  # its job limit).
  guard:
    if: github.repository == 'KrishivAI/krishiv-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          hour=$((10#$(date -u +%H)))
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$hour" -ge 6 ] && [ "$hour" -lt 18 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "A scheduled run that starts at $hour:xx UTC is outside the night window (18:00-06:00): skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
  smoke:
    if: needs.guard.outputs.go == 'true' && github.repository == 'KrishivAI/krishiv-engine'
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: $/.github/actions/setup-mold
      - name: Build the server
        run: cargo build -p krishiv-cli --features server,delta --locked
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Run the clients
        run: tests/connect-clients/run.sh --server-bin target/debug/krishiv --out target/connect-clients
      - name: Job summary
        if: always()
        run: cat target/connect-clients/summary.md target/connect-clients/delta-read-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: connect-clients
          path: target/connect-clients
          if-no-files-found: warn
