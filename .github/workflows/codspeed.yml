name: CodSpeed

on:
  # No merge_group trigger: CodSpeed rejects that event ("Event merge_group is not
  # supported by CodSpeed"), so its check is not required on main; PRs still get the report.
  # Pull requests run the benchmarks only when they change the execution path the
  # benchmarks measure; every push to main runs them all, so a regression from any
  # other change still shows up on the next main run and is fixed forward.
  pull_request:
    paths:
      - "crates/krishiv-exec/**"
      - "crates/krishiv-kernels/**"
      - "crates/krishiv-memory/**"
      - "crates/krishiv-io/**"
      - "crates/krishiv-alloc/**"
      - "crates/krishiv-types/**"
      - "crates/krishiv-common/**"
      - "crates/*/benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/codspeed.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Cold-cache runs took 27-73 minutes (instrumented build, then the run); a job
    # cancelled at the limit gets no cache save, so the retry started cold again.
    timeout-minutes: 90
    permissions:
      contents: read
      # OIDC authentication with CodSpeed (no token needed on public repositories).
      id-token: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Its own cache entry: the benchmark build (bench profile, codspeed instrumentation)
          # shares no artifacts with the other workflows' dev/test builds, and a run that is
          # cut off or fails after the build still saves what it compiled.
          shared-key: codspeed-bench
          cache-on-failure: true
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-codspeed
      - name: Build benchmarks
        run: cargo codspeed build --workspace
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: cargo codspeed run --workspace
