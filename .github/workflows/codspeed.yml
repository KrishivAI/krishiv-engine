name: CodSpeed

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Merge queue: CodSpeed compares a pull request against its base and already
  # reported there. Publish the required context on the merge-group commit.
  merge-group-status:
    name: CodSpeed merge-group status
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report the CodSpeed context as passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=success \
            -f context="CodSpeed Performance Analysis" \
            -f description="Benchmarks ran on the pull request; skipped for the merge group"

  benchmarks:
    name: Benchmarks
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # OIDC authentication with CodSpeed (no token needed on public repositories).
      id-token: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-codspeed
      - name: Build benchmarks
        run: cargo codspeed build --workspace
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: cargo codspeed run --workspace
