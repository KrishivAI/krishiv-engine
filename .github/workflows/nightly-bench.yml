name: Nightly benchmarks

# Manual trigger for now. Enable the nightly schedule once the baseline numbers are stable (P1).
on:
  workflow_dispatch:
    inputs:
      with_spark:
        description: "Also run the Spark 4.2 Connect baseline (needs Docker)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "0 3 * * *"

# One run at a time; a second dispatch queues instead of cancelling.
concurrency:
  group: nightly-bench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KRISHIV_DATA: ${{ github.workspace }}/krishiv-data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install harness
        working-directory: bench
        run: uv sync --frozen
      - name: Generate TPC-H SF1 (DuckDB dbgen, official-answer reference data)
        working-directory: bench
        run: uv run krishiv-datasets tpch-dbgen --sf 1
      - name: Run DuckDB TPC-H SF1
        working-directory: bench
        run: uv run krishiv-bench run --engine duckdb --suite tpch --dataset tpch-dbgen --sf 1
      - name: Run Spark Connect TPC-H SF1 (optional)
        if: ${{ inputs.with_spark }}
        working-directory: bench
        run: |
          docker compose -f baselines/docker-compose.yml up -d spark
          uv run krishiv-bench run --engine spark-connect --suite tpch --dataset tpch-dbgen --sf 1
          docker compose -f baselines/docker-compose.yml stop
      - name: Report
        working-directory: bench
        run: |
          uv run krishiv-bench report --suite tpch --sf 1 --dataset tpch-dbgen
          cat "$KRISHIV_DATA"/results/report_tpch-dbgen_sf1.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: krishiv-data/results/
