name: Publish to PyPI

# 0.2 release (owner 2026-11-11). MANUAL ONLY: this workflow runs when the maintainer dispatches it
# (Actions tab, "Run workflow") and at no other time: never on push, merge, tag or schedule
# (xtask/tests/policy.rs keeps it that way). RELEASING.md has the procedure: TestPyPI first, then
# this workflow, then crates.io. Publishing is a hard stop that needs the owner's explicit go.
#
# Two gates stand between a dispatch and an upload:
#   1. the `pypi` environment: its required reviewers must approve the run before the `publish`
#      job starts; its deployment branches/tags are limited to main and `v*` tags.
#   2. the ref check below: only main or a `v*` tag may publish.
# Uploading uses PyPI trusted publishing (OIDC), so there is no API token anywhere in this
# repository; the trusted publishers for `krishiv` and `krishiv-compat` are configured on pypi.org
# for this workflow file and the `pypi` environment.
#
# The wheels are built and tested by wheels.yml in this same run, then uploaded unchanged: the
# `krishiv` wheels and the `krishiv-compat` wheel.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  # The merge queue skips Miri, the fuzz-target build and the wheel matrix; the nightly CI run of
  # main runs them. Publishing needs that run green on this commit (or a later main commit).
  nightly-green:
    if: github.repository == 'KrishivAI/krishiv-engine' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Latest scheduled CI run is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-green-nightly.sh

  wheels:
    needs: nightly-green
    if: github.repository == 'KrishivAI/krishiv-engine' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/wheels.yml

  publish:
    needs: [nightly-green, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/krishiv
    permissions:
      contents: read
      id-token: write # trusted publishing to PyPI
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{wheels-*,compat-wheel-*}"
          path: dist
          merge-multiple: true
      - name: Wheels to upload
        run: |
          ls -l dist
          test "$(ls dist/*.whl | wc -l)" -ge 9
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
