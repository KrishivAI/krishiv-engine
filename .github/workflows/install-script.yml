name: Install script

# scripts/install.sh (served as https://krishiv.ai/install.sh) against a fake release directory, on
# Linux and macOS, with dash (Debian's sh) as well as the platform sh. Nothing is downloaded from or
# published to a real release.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/install.sh
      - tests/scripts/install_test.sh
      - .github/workflows/install-script.yml
      - .github/workflows/install-release.yml

permissions:
  contents: read

jobs:
  test:
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests (platform sh)
        run: sh tests/scripts/install_test.sh
      - name: Tests (bash, POSIX mode)
        run: bash --posix tests/scripts/install_test.sh
      - name: Tests (dash)
        if: runner.os == 'Linux'
        run: dash tests/scripts/install_test.sh
      - name: shellcheck
        run: shellcheck scripts/install.sh tests/scripts/install_test.sh
