name: Set up mold
description: >-
  Installs the mold linker as /usr/bin/ld on a Linux runner and never fails the job over it. The release tarball is
  cached on the version; on a cache miss it is downloaded from GitHub with retries, then the Ubuntu apt package is
  tried, and if both fail the job links with the default linker (slower, same result). Replaces rui314/setup-mold,
  whose download failed every job when github.com release downloads returned 504 (2026-11-08).
inputs:
  version:
    description: mold release to install from the tarball
    default: "3.0.0"
runs:
  using: composite
  steps:
    - name: Cache the mold tarball
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/mold-cache
        key: mold-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - name: Install mold (cache, download, apt, or the default linker)
      shell: bash
      env:
        MOLD_VERSION: ${{ inputs.version }}
      run: |
        set -u
        [ "$RUNNER_OS" = Linux ] || { echo "mold: not Linux, using the default linker"; exit 0; }
        arch=$(uname -m)
        tarball="$HOME/mold-cache/mold-$MOLD_VERSION-$arch-linux.tar.gz"
        mkdir -p "$HOME/mold-cache"
        if [ ! -s "$tarball" ]; then
          rm -f "$tarball"
          curl --proto '=https' --tlsv1.2 --location --silent --show-error --fail \
            --retry 5 --retry-delay 3 --retry-all-errors --connect-max-time 20 --max-time 90 \
            -o "$tarball" "https://github.com/rui314/mold/releases/download/v$MOLD_VERSION/mold-$MOLD_VERSION-$arch-linux.tar.gz" \
            || { echo "::warning::mold $MOLD_VERSION download failed"; rm -f "$tarball"; }
        fi
        if [ -s "$tarball" ] && sudo tar -C /usr/local --strip-components=1 --no-overwrite-dir -xzf "$tarball"; then
          mold=/usr/local/bin/mold
        else
          # A tarball that does not unpack is not worth caching.
          rm -f "$tarball"
          if sudo apt-get install -y --no-install-recommends mold >/dev/null 2>&1; then
            mold=$(command -v mold)
          else
            echo "::warning::mold is unavailable (download and apt both failed): linking with the default linker"
            exit 0
          fi
        fi
        sudo ln -sf "$mold" "$(realpath /usr/bin/ld)"
        "$mold" --version
