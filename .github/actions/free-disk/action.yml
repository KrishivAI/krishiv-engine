name: Free runner disk
description: >-
  Removes toolchains, SDKs and container images that the runner image ships and no Krishiv job uses (about 35 GB on
  ubuntu-latest), printing `df -h /` before and after. Used by the jobs that build the whole workspace, whose
  build outputs otherwise fill the 145 GB disk.
inputs:
  prune-images:
    description: Also remove the image's preinstalled container images (for jobs that run no containers).
    default: "true"
runs:
  using: composite
  steps:
    - name: Free runner disk
      shell: bash
      env:
        PRUNE_IMAGES: ${{ inputs.prune-images }}
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
          /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost \
          /opt/microsoft /opt/az /usr/lib/google-cloud-sdk /usr/lib/mono /usr/local/julia* /usr/local/graalvm \
          /opt/hostedtoolcache/Java_* /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy
        if [ "$PRUNE_IMAGES" = true ] && command -v docker > /dev/null; then
          sudo docker image prune --all --force > /dev/null || true
        fi
        df -h /
