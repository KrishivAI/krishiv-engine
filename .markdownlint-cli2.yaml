# markdownlint-cli2 configuration. CI: markdownlint on all Markdown outside vendored/generated paths.
config:
  default: true
  MD013: false # line length: prose is wrapped by taste, tables are long
  MD033: false # inline HTML is allowed (comments, <details>)
  MD041: false # first line need not be a heading (PR template starts with a comment)
  MD024:
    siblings_only: true
  MD036: false # bold-as-heading is used in task lists
  MD060: false # table column style
  MD022: false # compact heading/list layout is used in CLAUDE.md files
  MD031: false
  MD032: false
  MD058: false
ignores:
  - "target/**"
  - ".github/ci-fixtures/**"
  - "tests/spark-golden/**"
  - "tests/fixtures/**"
  - "**/node_modules/**"
  - "bench/**" # owned by the benchmark harness; lint once its docs are cleaned
  - ".superpowers/**"
  - ".claude/skills/**"
  - ".claude/agents/**"
