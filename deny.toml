# cargo-deny policy (ADR 0028). Run: `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # target-lexicon (pyo3 build dep)
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "0BSD",
    # libbz2-rs-sys (pure-Rust bzip2 for .bz2 text files); BSD-style
    "bzip2-1.0.6",
]
# CC0-1.0 is deliberately absent: it carries no patent grant, so it is allowed only for
# Python dependencies (dependency-review in security.yml), not Rust crates in the binary.
confidence-threshold = 0.9
# tiny-keccak (CC0-1.0, a public-domain dedication) is reached only on wasm32:
# arrow-array enables ahash's `compile-time-rng` there (const-random-macro, a
# proc macro); native targets use `runtime-rng` and never build it.
# webpki-root-certs (CDLA-Permissive-2.0, Mozilla's root store as data) is
# reached through reqwest's rustls platform verifier, which object_store's
# `aws`/`gcp`/`azure` features enable (P2-T084).
exceptions = [
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
# Global default is a warning; the crates that matter for ABI/FFI and Arrow
# interchange are denied per-crate below (ADR 0028).
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path dependencies

deny = [
    # Banned engines/stores/TLS stacks (ADR 0028).
    # cargo-deny crate specs have no globs, so the datafusion-* family is
    # enumerated. A new datafusion-* crate arriving transitively would be
    # caught by review of Cargo.lock (and its parent, already banned).
    { crate = "datafusion", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-common", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-common-runtime", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-catalog", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-catalog-listing", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-datasource", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-datasource-parquet", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-datasource-csv", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-datasource-json", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-datasource-arrow", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-doc", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-execution", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-expr", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-expr-common", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-functions", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-functions-aggregate", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-functions-aggregate-common", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-functions-nested", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-functions-table", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-functions-window", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-functions-window-common", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-macros", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-optimizer", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-physical-expr", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-physical-expr-common", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-physical-expr-adapter", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-physical-optimizer", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-physical-plan", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-proto", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-proto-common", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-pruning", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-session", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-sql", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-substrait", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-spark", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-ffi", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "datafusion-cli", reason = "DataFusion family is banned (ADR 0028)" },
    { crate = "deltalake", reason = "use delta_kernel directly" },
    { crate = "iceberg-datafusion", reason = "pulls in DataFusion" },
    { crate = "rocksdb", reason = "state backend is SlateDB" },
    { crate = "librocksdb-sys", reason = "state backend is SlateDB" },
    { crate = "openssl", reason = "rustls only" },
    { crate = "openssl-sys", reason = "rustls only" },
    { crate = "async-std", reason = "tokio only (ADR 0028)" },
    { crate = "actix", reason = "axum/tokio only (ADR 0028)" },
    { crate = "actix-web", reason = "axum/tokio only (ADR 0028)" },
    { crate = "actix-rt", reason = "axum/tokio only (ADR 0028)" },
    { crate = "figment", reason = "typed config registry is our own (ADR 0028)" },
    { crate = "chrono-tz", reason = "jiff only (ADR 0028)" },
    { crate = "pyo3-arrow", reason = "own PyCapsule bridge (ADR 0028)" },
    { crate = "arrow-pyarrow", reason = "own PyCapsule bridge (ADR 0028)" },
    { crate = "divan", reason = "criterion only (ADR 0028)" },
    # anyhow is banned workspace-wide (libraries use thiserror; ADR 0028).
    # Banned crates here are not currently in the dependency graph. If a
    # third-party dependency ever pulls one in, add `wrappers = ["<parent>"]`
    # to that entry with a justification rather than removing the ban.
    # Exceptions: the `codspeed` bench instrumentation crate (dev-dependency only, never shipped) and
    # `prost-derive` (the derive macro of prost, which krishiv-connect needs; a proc macro runs at
    # build time and its dependencies are not linked into any Krishiv binary).
    { crate = "anyhow", wrappers = ["codspeed", "prost-derive"], reason = "libraries use thiserror (ADR 0028)" },
    # Single-version crates (deny duplicates).
    { crate = "tokio", deny-multiple-versions = true },
    { crate = "prost", deny-multiple-versions = true },
    { crate = "pyo3", deny-multiple-versions = true },
    { crate = "parquet", deny-multiple-versions = true },
    { crate = "arrow-array", deny-multiple-versions = true },
    { crate = "arrow-buffer", deny-multiple-versions = true },
    { crate = "arrow-schema", deny-multiple-versions = true },
    { crate = "arrow-data", deny-multiple-versions = true },
    { crate = "arrow-ipc", deny-multiple-versions = true },
    { crate = "arrow-flight", deny-multiple-versions = true },
    { crate = "arrow-select", deny-multiple-versions = true },
    { crate = "arrow-cast", deny-multiple-versions = true },
    { crate = "arrow-arith", deny-multiple-versions = true },
    { crate = "arrow-ord", deny-multiple-versions = true },
    { crate = "arrow-row", deny-multiple-versions = true },
    { crate = "arrow-string", deny-multiple-versions = true },
    { crate = "arrow-csv", deny-multiple-versions = true },
    { crate = "arrow-json", deny-multiple-versions = true },
    { crate = "arrow", deny-multiple-versions = true },
    # object_store is Krishiv's version to coordinate with delta_kernel (ADR 0028
    # update 2026-10-17): pinned to =0.14.2 in Cargo.toml, never two versions.
    { crate = "object_store", deny-multiple-versions = true },
]

# The parquet crate's `object_store` feature is banned: Krishiv owns its
# object-store reader/writer (ADR 0014/0028), so ParquetObjectReader and
# ParquetObjectWriter must not exist (also checked by `cargo xtask source-guard`).
[[bans.features]]
crate = "parquet"
deny = ["object_store"]

