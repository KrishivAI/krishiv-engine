# Quarantine (owner policy 2026-11-07: a flaky test moves to a non-blocking profile with an issue and an owner,
# fixed within 3 days). `two_tasks_of_one_query_share_their_chunks` (krishiv-exec `tests/nested_loop.rs`) fails on
# CI with UNABLE_TO_ACQUIRE_MEMORY (584 and 64,896 bytes; 0 of 40 local runs) and failed PR #576's test job (run
# 42433806198); owner opus-3, deadline 2026-11-11. `moment_windows_from_disk_equal_the_in_memory_result`
# (krishiv-session `tests/moment_window_spill.rs`) is back: after its fix (#614) it fails on CI with
# KRISHIV_QUERY_ABORTED_OUT_OF_MEMORY (a single query aborted when its spill did not free memory in time; the
# test retries only UNABLE_TO_ACQUIRE_MEMORY), on main (run 42501540888) and PRs #576 and #627 (runs 42491099543,
# 42502636034); owner opus-3, deadline 2026-11-11. Every run of the default profile skips them; the `quarantine`
# profile runs only them (CI job `test-quarantine`, not required). Take each out with its root-cause fix. A name or
# `-E` filter on the default profile selects nothing for them: run `--profile quarantine` (or
# `--ignore-default-filter`).
[profile.default]
default-filter = "not (test(=moment_windows_from_disk_equal_the_in_memory_result) | test(=two_tasks_of_one_query_share_their_chunks))"

[profile.quarantine]
default-filter = "test(=moment_windows_from_disk_equal_the_in_memory_result) | test(=two_tasks_of_one_query_share_their_chunks)"

# Acceptance tests with stall or wall-clock bounds can flake on loaded
# shared runners (a driver waiting on a lock held by a thread that is paging
# code in trips `fail_on_stall` without any non-yielding operator); retry them,
# and only them:
# - a slow scan does not delay a short query on one thread,
# - a cancelled query stops within 100 ms,
# - a blocking call delays a short query by at most 10 ms,
# - the TPC-H yield suite fails on one poll past its stall threshold (10 ms, or
#   100 ms under coverage instrumentation),
# - so does the test that one very large batch is processed in chunks.
[[profile.default.overrides]]
filter = "test(=a_slow_scan_does_not_delay_a_short_query) | test(=a_cancelled_query_stops_within_100ms_and_releases_everything) | test(=blocking_work_does_not_delay_a_short_query) | test(=tpch_suite_counts_no_stalls) | test(=a_very_large_batch_is_processed_in_chunks)"
retries = 2
