# Acceptance tests with stall or wall-clock bounds can flake on loaded
# shared runners (a driver waiting on a lock held by a thread that is paging
# code in trips `fail_on_stall` without any non-yielding operator); retry them,
# and only them:
# - a slow scan does not delay a short query on one thread,
# - a cancelled query stops within 100 ms,
# - a blocking call delays a short query by at most 10 ms,
# - the TPC-H yield suite fails on one poll past its stall threshold (10 ms, or
#   100 ms under coverage instrumentation),
# - so does the test that one very large batch is processed in chunks.
[[profile.default.overrides]]
filter = "test(=a_slow_scan_does_not_delay_a_short_query) | test(=a_cancelled_query_stops_within_100ms_and_releases_everything) | test(=blocking_work_does_not_delay_a_short_query) | test(=tpch_suite_counts_no_stalls) | test(=a_very_large_batch_is_processed_in_chunks)"
retries = 2
