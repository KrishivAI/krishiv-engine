# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings. Reviews are advisory: required checks and
# maintainer approval remain the merge gate.
language: en-US
tone_instructions: "Be concise and technical. Flag correctness, safety and Spark-compatibility issues first; skip style nits that rustfmt or clippy already enforce."
early_access: false
reviews:
  # Assertive: more findings per review, at no extra cost on the OSS plan.
  profile: assertive
  request_changes_workflow: false
  # Keep PR descriptions as written by the author.
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  changed_files_summary: true
  suggested_labels: false
  suggested_reviewers: false
  path_filters:
    - "!**/Cargo.lock"
    - "!tests/fixtures/**"
    - "!**/generated/**"
  path_instructions:
    - path: "crates/**/*.rs"
      instructions: >-
        Library code must not unwrap, expect or panic on user input; errors use
        thiserror with Spark error classes. Lint suppressions use #[expect] with a
        reason, never #[allow]. Check Spark 4.x semantics (nulls, overflow, ANSI
        mode, decimal precision, time zones) and that Arrow buffers are not copied
        needlessly.
    - path: "xtask/**"
      instructions: "Developer tooling: prefer clear error messages naming the fix."
    - path: ".github/workflows/**"
      instructions: >-
        Third-party actions must be pinned by full commit SHA; jobs use
        least-privilege permissions and GitHub-hosted runners only.
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  tools:
    # Already enforced in CI; avoid duplicate comments.
    clippy:
      enabled: false
    actionlint:
      enabled: false
    markdownlint:
      enabled: false
chat:
  auto_reply: true
knowledge_base:
  learnings:
    scope: local
